<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R&amp;B Site Registers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Vadodara:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-book app — work bar on top, register shelf on the left, ruled register sheet on the right */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --rule:#E5E7EB; --rule-strong:#CBD2DC;
  --accent:#1E3A8A; --accent-2:#0F2557; --accent-soft:#EEF2FB; --head:#F4F6FA;
  --bad:#B42318; --bad-soft:#FDECEA; --warn:#A15C07; --warn-soft:#FEF4E2; --ok:#067647; --ok-soft:#E7F6EE;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --f-ui:"Inter","Hind Vadodara","Noto Sans Gujarati","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.86em}
header.top{position:relative;z-index:6;background:var(--surface);border-top:4px solid var(--accent);border-bottom:1px solid var(--rule);
  padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand i{width:38px;height:38px;border-radius:8px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--accent-2)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.workpick{display:flex;gap:8px;align-items:center;flex:1 1 360px;min-width:0}
.workpick select{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-weight:500}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.primary:hover{color:#fff;background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.navitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
nav.shelf{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navbar{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
.tab{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--accent);background:var(--accent-soft)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .car{font-size:9px;opacity:.55}
.tab .cnt{font-family:var(--f-num);font-size:11px;color:var(--muted);background:var(--head);border-radius:10px;padding:0 7px}
.navbar .spacer{flex:1}
.dd{position:relative;display:flex}
.dd .menu{display:none;position:absolute;top:100%;left:0;min-width:340px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;z-index:20}
.dd.open .menu{display:block}
@media (hover:hover){.dd:hover .menu{display:block}}
.menu h4{margin:6px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.navitem{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px}
.navitem:hover{background:var(--accent-soft);color:var(--accent)}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .cnt{font-family:var(--f-num);font-size:11.5px;color:var(--muted);background:var(--head);border-radius:10px;padding:0 7px;min-width:24px;text-align:center}
.shelf .mobsel{display:none;width:100%;margin:10px 0;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-weight:600}
.navitem .dot,.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:4px}
.app{max-width:1500px;margin:0 auto;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheethead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.sheethead h2{margin:0;font-size:22px;line-height:1.3;text-wrap:balance;font-weight:700;color:var(--accent-2);letter-spacing:-.01em}
.sheethead .sub{color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid #F3D19C;border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:13.5px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;width:100%;font-size:13.5px}
table.reg th,table.reg td{border:1px solid var(--rule);padding:6px 8px;vertical-align:top}
table.reg thead th{background:var(--head);font-weight:600;font-size:12.5px;line-height:1.35;text-align:center;vertical-align:middle;color:#374151}
table.reg tbody tr:nth-child(even) td{background:#FAFBFD}
table.reg thead tr.colno th{font-family:var(--f-num);font-weight:400;font-size:11px;color:var(--muted);padding:2px}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:hover td{background:var(--accent-soft)}
table.reg td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
table.reg td.calc{color:var(--accent)}
table.reg td.d{white-space:nowrap;font-family:var(--f-num);font-size:12.5px}
table.reg td.sg{min-width:56px}
table.reg tr.blk1 td{border-top:2px solid var(--rule-strong)}
table.reg td.lbl{font-size:13px;min-width:190px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
td.flagcell{min-width:110px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);border-left:3px solid var(--accent)}
.card .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card .v{font-size:24px;font-weight:600;font-family:var(--f-num);color:var(--accent-2)}
.list{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--rule);flex-wrap:wrap;align-items:center}
.list .li:first-child{border-top:0}
.list h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--rule);background:var(--head);color:var(--accent-2)}
dialog{border:1px solid var(--rule);border-radius:12px;box-shadow:0 24px 48px rgba(16,24,40,.18);padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dlg header{padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--head);display:flex;justify-content:space-between;gap:10px;align-items:center}
.dlg header h3{margin:0;font-size:16px;color:var(--accent-2)}
.dlg .body{padding:14px 16px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.dlg footer{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);line-height:1.3}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--rule-strong);border-radius:7px;background:var(--surface);width:100%}
.fld .calcv{padding:7px 9px;border:1px dashed var(--rule-strong);border-radius:5px;color:var(--accent);font-family:var(--f-num);font-size:13px;min-height:36px}
.offrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grpttl{grid-column:1/-1;font-weight:600;font-size:13px;border-bottom:1px solid var(--rule);padding-bottom:3px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;z-index:50}
#printArea{display:none}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate[hidden]{display:none}
.gcard{background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:26px 24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.gbody{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.chatlog{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:12px;min-height:280px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex}.msg.user{justify-content:flex-end}
.msg .bub{max-width:min(720px,92%);padding:9px 12px;border-radius:10px;background:var(--head);min-width:0;overflow-wrap:anywhere}
.msg.user .bub{background:var(--accent-soft)}
table.kv{border-collapse:collapse;margin:6px 0}table.kv td{padding:3px 10px 3px 0;vertical-align:top}
.composer{display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crow textarea{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface)}
.crow select{padding:7px 9px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mbpages{display:flex;flex-direction:column;gap:18px}
.mbsheet{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:18px 20px;font-size:13px;min-width:0}
.mbsheet .tablewrap{border:0}
.mbtop{display:flex;justify-content:space-between}.mbtop .r,.mbsign .r{text-align:right}
.mbt,.mbt2{text-align:center;font-weight:700;margin:6px 0}.mbt2{text-decoration:underline}
.mbinfo{margin:4px 0 10px;line-height:1.6}
table.mbt-rec td.desc{white-space:normal}table.mbt-rec tr.ih td{border-top:2px solid var(--rule-strong)}
table.mbt-rec td.lbl{text-align:right;font-weight:600;white-space:nowrap}table.mbt-rec tr.tot td{font-weight:700}
table.mbt-rec td.n{text-align:right;font-family:var(--f-num);font-size:12px}table.mbt-rec tr.gap td{height:14px;border-left:0;border-right:0}
.mbsign{display:flex;justify-content:space-between;margin-top:26px;gap:20px}
.absit{margin:10px 0 4px}.absit .desc{margin:2px 0 4px 0}
table.absq{border-collapse:collapse;margin-left:24px}table.absq td{padding:1px 10px}table.absq td.n{text-align:right;font-family:var(--f-num);min-width:70px}
table.absq tr.lim td{font-weight:700}
.cv{font-family:"Times New Roman",Georgia,serif;min-height:520px;position:relative}
.cv1{font-weight:700;font-size:18px;margin:60px 0 0 40px}.cvee{position:absolute;left:90px;bottom:120px;text-align:center}
table.cvt{border-collapse:collapse;margin-top:16px}table.cvt td{padding:12px 6px;vertical-align:top}table.cvt td.k{font-weight:700;white-space:nowrap}table.cvt.sm td{padding:6px}
.cvt .red{color:var(--bad)}
.cvsig{display:flex;justify-content:space-around;text-align:center;font-size:12px;margin-top:40px}.cvsig.r{justify-content:flex-end}
.cvh{text-align:center;font-weight:700;text-decoration:underline;margin:30px 0 16px}
.cvp{text-indent:60px;line-height:1.6}
table.cvg{border-collapse:collapse;width:100%;font-size:12px}table.cvg th,table.cvg td{border:1px solid var(--ink);padding:5px;vertical-align:top}
table.ln td{padding:2px}table.ln input,table.ln select{padding:4px 5px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--surface);width:100%;min-width:56px}
@media (max-width:860px){
  .navbar{display:none}
  .shelf .mobsel{display:block}
  .app{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:16px}
  header.top{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .brand small{display:none}
  .workpick{flex-wrap:wrap}.workpick select{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- print (A4 landscape register) ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  @page cover{size:A4 portrait;margin:14mm}
  .pg.portrait{page:cover}
  .pg .mbtop,.pg .mbinfo{font-size:11px}.pg .mbt,.pg .mbt2{font-size:12px}
  table.p.mbt-rec{font-size:9.5px}table.p.mbt-rec td{border:0;border-left:1px solid #000;border-right:1px solid #000;padding:1px 4px}table.p.mbt-rec{border:1px solid #000}
  table.p.mbt-rec tr.ih td{border-top:1px solid #000}table.p.mbt-rec td.n{text-align:right}
  .pg.cv{font-family:"Times New Roman",serif;font-size:13px;position:relative;height:260mm}
  .pg .cvee{position:absolute;left:30mm;bottom:60mm;text-align:center}.pg .cvsig{position:absolute;left:0;right:0;bottom:30mm}
  .pg table.cvg td,.pg table.cvg th{border:1px solid #000}.pg .red{color:#c00}
  .pg .absit{font-size:10px;margin:3px 0;page-break-inside:avoid}.pg table.absq td{padding:0 8px;font-size:10px}.pg .mbsign{margin-top:14px;font-size:10.5px}
  body{background:#fff;color:#000;font-size:11px}
  body::before{display:none}
  header.top,nav.shelf,.app,dialog,.toast{display:none!important}
  #printArea{display:block}
  .pg{page-break-after:always;padding:6mm 4mm}
  .pg:last-child{page-break-after:auto}
  .cover{text-align:center;padding-top:30mm}
  .cover h1{font-size:26px;margin:0 0 6px}
  .cover table{margin:18mm auto 0;border-collapse:collapse;width:70%;font-size:13px;text-align:left}
  .cover td{border:1px solid #000;padding:7px 10px}
  table.p{border-collapse:collapse;width:100%;font-size:10px}
  table.p.xg{table-layout:auto;font-size:9px}table.p.xg td{white-space:normal}
  table.p th,table.p td{border:1px solid #000;padding:3px 4px;vertical-align:top}
  table.p th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p td.n{text-align:right}
  table.p tr.blk1 td{border-top:2px solid #000}
  .ph{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
  .ph h2{font-size:15px;margin:0;text-align:center;flex:1}
}
.fld label.chk{display:flex;flex-direction:row;gap:8px;align-items:center;margin:2px 0;font-size:13.5px;color:var(--ink,inherit)}
.fld label.chk input{width:auto;padding:0}
.fld label.chk input[data-fq]{padding:4px 6px}
.xgw{max-height:75vh}
.dropping{outline:3px dashed var(--accent);outline-offset:6px;border-radius:10px;background:var(--accent-soft)}
table.xg{border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.xg td{border:1px solid var(--rule);padding:3px 6px;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
table.xg td.n{text-align:right;font-family:var(--f-num);font-size:12px;white-space:nowrap}
table.xg td.b{font-weight:700}
.segs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.list .li.sel{background:var(--accent-soft)}
.mbxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 18px;margin-top:4px}
</style>

<header class="top">
  <div class="brand"><i>R&amp;B</i><span><b>Site Registers &amp; MB</b><small>Roads &amp; Buildings Sub Division, Dahod</small></span></div>
  <div class="workpick">
    <select id="workSel" aria-label="Kaam chuno"></select>
    <button class="btn" id="workEdit">Kaam ki vigat</button>
    <button class="btn" id="workNew">+ Naya kaam</button>
  </div>
  <div class="sync" id="syncBox"></div>
</header>

<nav class="shelf" id="shelf" aria-label="Registers"></nav>
<div class="app">
  <main id="main"></main>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog">
  <header><h3 id="dlgTitle"></h3><button type="button" class="btn small" id="dlgClose">Band karo</button></header>
  <div class="body" id="dlgBody"></div>
  <footer><div><button type="button" class="btn danger" id="dlgDel" hidden>Delete</button></div>
    <div class="actions"><button type="button" class="btn" id="dlgCancel">Cancel</button><button type="submit" class="btn primary" id="dlgSave">Save</button></div></footer>
</form></dialog>

<div id="printArea"></div>
<div class="toast" id="toast" hidden></div>
<div id="gate" hidden><div class="gcard"><div class="brand"><i>R&amp;B</i> Site Registers</div><div class="gbody"></div></div></div>

const EMBED = (()=>{try{return window.self!==window.top}catch(e){return true}})();

  C('dim','ડાયમેન્શન ટોલરન્સ','calc',{fn:r=>{if(r.dL==null&&r.dW==null&&r.dH==null)return'';const t=brickTol(r.btype);const f=(v,[a,b])=>v==null?'–':`${v}${v<a||v>b?' ✗':' ✓'}`;return `L ${f(r.dL,t.L)} · W ${f(r.dW,t.W)} · H ${f(r.dH,t.H)}`}}),
  C('remarks','રીમાર્કસ')],
 flag:r=>{const c=+(r.cls||3.5),req=c*10,waMax=c<=12.5?20:15,effOk=c<=12.5?['','Nil','Slight','Moderate']:['','Nil','Slight'];
  if(r.cs!=null&&r.cs<req)return['bad',`Avg strength ${req} se kam`];
  if(r.csMin!=null&&r.csMin<req)return['bad','Ek int class se kam – neechi class'];
  if(r.wa!=null&&r.wa>waMax)return['bad',`Absorption ${waMax}% se zyada`];
  if(!effOk.includes(r.eff||''))return['bad','Efflorescence zyada'];
  if(/✗/.test(r.dim||''))return['bad','Naap tolerance se bahar'];
  return r.cs!=null?['ok',`Class ${c} OK`]:null}},

{id:'tiles',grp:'Material Testing',short:'Cement Tiles Testing Patrak-5',gu:true,

 note:'IS 1237 (cement concrete flooring tiles): water absorption ≤10%, wet transverse strength avg ≥3.0 N/mm², wear avg ≤3.5 mm (general purpose) / ≤2.0 mm (heavy duty).',sortKey:'_c',

  C('duty','Tile ka upyog','sel',{options:['General purpose','Heavy duty'],formOnly:true}),
  C('dims','લાદીના માપ તથા કદ'),C('wa','વોટર એબ્સોર્પશન ટકામાં','num',{dp:1}),
  C('tsv','Transverse strength N/mm²','num',{dp:2,formOnly:true}),C('tsc','Test condition','sel',{options:['ભીની (wet)','સુકી (dry)'],formOnly:true}),
  C('ts','ટ્રાન્સવર્સ સ્ટ્રેન્થ ભીની કે સુકી','calc',{fn:r=>r.tsv!=null?`${fmt(r.tsv,2)} N/mm² – ${(r.tsc||'ભીની (wet)').split(' ')[0]}`:''}),
  C('abr','એબ્રેશન મી.મી.','num',{dp:2}),C('remarks','વિશેષ નોંધ')],
 flag:r=>{const heavy=r.duty==='Heavy duty';
  if(r.wa!=null&&r.wa>10)return['bad','Absorption 10% se zyada'];
  if(r.tsv!=null&&!/સુકી/.test(r.tsc||'')&&r.tsv<3)return['bad','Wet transverse 3.0 se kam'];
  if(r.abr!=null&&r.abr>(heavy?2:3.5))return['bad',`Wear ${heavy?2:3.5} mm se zyada`];
  return (r.wa!=null||r.tsv!=null||r.abr!=null)?['ok','IS 1237 OK']:null}},

{id:'aggTest',grp:'Material Testing',short:'Aggregate Test Results',gu:true,
 title:'એગ્રીગેટ, મેટલ, ગ્રેવલ, કપચી વગેરેનાં ચકાસણી પરિણામો દર્શાવતું પત્રક',
 note:'Building concrete ke liye IS 383 ke maandand: impact value ≤45% (RCC/PCC) / ≤30% (wearing surface jaise floor); abrasion (Los Angeles) ≤50% / ≤30%; flakiness + elongation milake ≤40%; water absorption 2% se zyada ho to soundness test zaroori. (Book mein chhape remarks road kaam ke hain, wo yahan lagu nahi.)',sortKey:'_c',
 cols:[C('_sr','અનુક્રમ નંબર','sr'),C('sample','નમુનાની વિગત ખાણ અને રસ્તાની કિ.મી. / સ્થળ'),C('gradeGrp','ગ્રેઈડ ગ્રુપ'),
  C('use','Kis kaam ke liye','sel',{options:['RCC / PCC (non-wearing)','Wearing surface (floor)'],formOnly:true}),
  C('sg','સ્પેશીફીક ગ્રેવીટી','num',{dp:2}),
  C('wa','વોટર એબ્સોર્પશન','num',{dp:2}),C('iv','ઈમ્પેક્ટ વેલ્યુ ટકા','num',{dp:1}),C('av','એબ્રેશન વેલ્યુ ટકા','num',{dp:1}),C('sound','સાઉન્ડનેસ'),
  C('fi','ફ્લેકીનેસ ઈન્ડેક્ષ ટકા (FI+EI)','num',{dp:1}),C('remarks','રીમાર્કસ')],
 flag:r=>{const w=/Wearing/.test(r.use||'');const iv=w?30:45,av=w?30:50;
  if(r.iv!=null&&r.iv>iv)return['bad',`Impact ${iv}% se zyada`];
  if(r.av!=null&&r.av>av)return['bad',`Abrasion ${av}% se zyada`];
  if(r.fi!=null&&r.fi>40)return['bad','FI+EI 40% se zyada'];
  if(r.wa!=null&&r.wa>2&&!r.sound)return['warn','WA >2%: soundness test karo'];
  return (r.iv!=null||r.av!=null||r.fi!=null)?['ok','IS 383 OK']:null}},

{id:'sieve',grp:'Material Testing',short:'Sieve Analysis (Metal/Kapchi)',gu:true,layout:'sieve',
 title:'મેટલ, કપચી, ગ્રેવલ વગેરેના સીવ એનાલીસીસના પરિણામો',
 note:'Har sieve par jo vajan ruka (gram) wo daalo. Cumulative aur pasar thata taka apne aap. Remarks column mein IS 383 ki limit aur ✓/✗. Reti ke liye "Sand (zone apne aap)" chuno, zone khud pata chalega.',sortKey:'date',
 cols:[C('date','તારીખ','date'),C('material','માલનો પ્રકાર','sel',{options:['મેટલ','કપચી','ગ્રેવલ','ગ્રીટ','રેતી']}),C('lab','લેબોરેટરી નંબર / તારીખ'),
  C('totalWt','કુલ વજન ગ્રામ','num',{dp:0}),C('spec','IS 383 grading jisse milana hai','sel',{options:SPECS}),
  ...SIEVES.map((sv,i)=>C('w'+i,sv,'num',{dp:0,sec:'દરેકનું અલગ વજન (ગ્રામ)'})),C('remarks','રીમાર્કસ','text',{wide:true})],
 compute(rows){return rows.map(r=>{const c={...r};const ws=SIEVES.map((_,i)=>num(r['w'+i]));const sum=ws.reduce((a,v)=>a+(v||0),0);
   const T=num(r.totalWt)||sum;c._T=T;let cum=0;SIEVES.forEach((_,i)=>{const w=ws[i];if(w!=null)cum+=w;c['cw'+i]=w!=null||cum?cum:null;c['cp'+i]=T&&c['cw'+i]!=null?cum/T*100:null;c['pp'+i]=c['cp'+i]!=null?100-c['cp'+i]:null});
   c._diff=num(r.totalWt)&&sum?sum-num(r.totalWt):null;c._g=gradeCheck(c);return c})},
 flag:r=>{if(!SIEVES.some((_,i)=>num(r['w'+i])!=null))return null;if(r._diff&&r._diff/r._T>0.01)return['warn',`Ruka vajan kul se ${fmt(r._diff,0)} g zyada`];const g=r._g;if(!g||g.ok==null)return null;
  return g.ok?['ok',(g.auto?g.spec+' – ':'')+'IS 383 OK']:['bad',g.auto?'Kisi zone mein nahi':'Grading limit se bahar']}},

{id:'cube3',grp:'Concrete',short:'Cube Testing Patrak-3',gu:true,
 title:'કોંક્રીટના ક્યુબના ટેસ્ટીંગ પરિણામો દર્શાવતું પત્રક - ૩',
 note:'Ek din ki dhalai ki ek line. Kaam ka jaththo daalte hi IS 456 cl. 15.2.2 se kitne sample (aur cube) lene hain wo aata hai – har sample mein 6 cube (3 – 7 din, 3 – 28 din); sirf 28 din ka test ho to form mein 3 chuno. 7/28 din ki due date Dashboard par. Reading kN (150 mm cube) ya N/mm² mein daalo; register mein kg/cm² chhapega (×10.197). Column 12/13: 28 din = fck, 7 din = 2/3 fck (sirf andaaz, IS 456 mein acceptance 28 din par hi). Acceptance IS 456 Table 11: har set ≥ fck−4 (M20 aur upar) / fck−3 (M15); 4 set ka mean ≥ fck+4 / fck+3. Set ke 3 cube average se ±15% se zyada alag ho to sample invalid (cl. 15.4).',
 sortKey:'date',
 cols:[C('_sr','અનુક્રમ નંબર','sr'),C('date','ક્યુબ લીધાની તારીખ','date'),
  C('grade','Grade (M20/M25...)','sel',{options:['',...GRADES],formOnly:true}),
  C('mark','ક્યુબ ઉપરનું નિશાન તથા કોન્ક્રીટના વપરાશનું સ્થળ'),
  C('qty','ટેન્ડર મુજબ થયેલ કામનો રોજિંદો જથ્થો (ઘ.મી.)','num',{dp:2}),
  C('cps','Ek sample mein kitne cube','sel',{options:['6 (3 – 7 din + 3 – 28 din)','3 (sirf 28 din)'],formOnly:true}),
  C('reqNos','કામની નિર્દિષ્ઠ વિગતો પ્રમાણે ક્યુબ લેવાની સંખ્યા','calc',{dp:0,fn:r=>reqSamples(r.qty)*cpsOf(r)||null,xf:x=>{const q=x.R('qty');return `IF(${q}="","",${cpsOf(x.c)}*IF(${q}<=5,1,IF(${q}<=15,2,IF(${q}<=30,3,IF(${q}<=50,4,4+ROUNDUP((${q}-50)/50,0))))))`}}),
  C('cubesN','લીધેલ ક્યુબની સંખ્યા','num',{dp:0,formOnly:true}),C('cubeSize','ક્યુબનું માપ','text',{formOnly:true,def:'15 સે.મી.'}),
  C('cubes','લેવામાં આવેલ ક્યુબના સંખ્યા તથા માપ','calc',{fn:r=>r.cubesN!=null?`${r.cubesN} નંગ, ${r.cubeSize||''}`:''}),
  C('curing','ક્યોરીંગનો સમય ગાળો'),
  C('lab','ક્યુબ ટેસ્ટ કર્યાની તારીખ અને લેબોરેટરી નંબર'),
  C('density','કોન્ક્રીટની ઘનતા ગ્રામ / સી.સી.','num',{dp:2}),
  C('unit','Reading ki unit','sel',{options:['kN (CTM dial)','N/mm²'],formOnly:true}),
  C('r7','7 દિવસ – 3 cube reading','tri',{formOnly:true}),C('r28','28 દિવસ – 3 cube reading','tri',{formOnly:true}),
  C('n7','7 din N/mm² (har cube)','calc',{tri:true,formOnly:true,fn:r=>(r.r7||[]).map(v=>toMpa(v,r.unit))}),
  C('n28','28 din N/mm² (har cube)','calc',{tri:true,formOnly:true,fn:r=>(r.r28||[]).map(v=>toMpa(v,r.unit))}),
  C('a7','૭ દિવસના અંતે','calc',{dp:0,grpH:'ક્યુબની મજબુતાઈ કિલો/સે.મી.²',fn:r=>{const a=avg(r.n7||[]);return a==null?null:a*KGF}}),
  C('a28','૨૮ દિવસના અંતે','calc',{dp:0,grpH:'ક્યુબની મજબુતાઈ કિલો/સે.મી.²',fn:r=>{const a=avg(r.n28||[]);return a==null?null:a*KGF}}),
  C('q7','૭ દિવસના અંતે','calc',{dp:0,grpH:'ડિઝાઈ કોડ પ્રમાણે જરૂરિયાત કિલો/સે.મી.²',fn:r=>fck(r.grade)?2/3*fck(r.grade)*KGF:null}),
  C('q28','૨૮ દિવસના અંતે','calc',{dp:0,grpH:'ડિઝાઈ કોડ પ્રમાણે જરૂરિયાત કિલો/સે.મી.²',fn:r=>fck(r.grade)?fck(r.grade)*KGF:null}),
  C('t7','7 din test due','calc',{date:true,formOnly:true,fn:r=>addDays(r.date,7)}),C('t28','28 din test due','calc',{date:true,formOnly:true,fn:r=>addDays(r.date,28)}),
  C('remarks','રીમાર્કસ સહી')],
 flag:r=>{const f=fck(r.grade);const m28=avg(r.n28||[]),m7=avg(r.n7||[]);
  const sp=(a,s)=>a&&s.filter(v=>v!=null).some(v=>Math.abs(v-a)/a>0.15);
  if(r.reqNos&&r.cubesN!=null&&r.cubesN<r.reqNos)return['bad',`Cube kam: ${r.reqNos} chahiye`];
  const dd=f&&f<20?3:4;
  if(m28!=null&&f){if(sp(m28,r.n28||[]))return['warn','Cube ±15% se alag – sample invalid'];if(m28<f-dd)return['bad',`28d ${m28.toFixed(1)} N/mm² < fck−${dd}`];if(m28<f+dd)return['warn',`28d < fck+${dd}: 4 set ka mean dekho`];return['ok','28d OK']}
  if(m7!=null&&f)return m7<2/3*f?['warn',`7d ${m7.toFixed(1)} N/mm² (2/3 fck se kam)`]:['ok','7d OK'];
  if(!f&&(m7!=null||m28!=null))return['warn','Grade bharo'];
  return null}},

function sorted(reg,rows){const k=reg.sortKey||'_c';return [...rows].sort((a,b)=>{const x=(a[k]||'')+'', y=(b[k]||'')+'';return x<y?-1:x>y?1:(a._c||0)-(b._c||0)})}
function compute(reg,work=W()){
  const rows=sorted(reg,rowsOf(reg.id,work));
  if(reg.compute)return reg.compute(rows).map(c=>({...c,_flag:reg.flag?.(c)||null}));
  let prev=null;
  return rows.map((r,i)=>{const c={...r,_sr:i+1,__raw:r};
    for(const col of reg.cols){
      if(col.type==='calc')c[col.key]=col.fn(c,prev);
      else if(col.type==='carry'){const v=num(r[col.key]);c[col.key]=v!=null?v:col.fn(c,prev)}
      else if(col.type==='num'){const v=num(r[col.key]);c[col.key]=v}
    }
    c._flag=reg.flag?.(c)||null;prev=c;return c});
}

function cellVal(col,c,gu){
  const v=c[col.key];
  if((col.only==='first'&&!c._first)||(col.only==='last'&&!c._last))return'';
  if(col.type==='sr')return gd(v,gu);
  if(col.type==='sign')return'';
  if(col.type==='date'||col.date)return fdate(v);
  if(col.type==='tri'||col.tri)return (v||[]).map(x=>x==null||x===''?'–':(col.tri?fmt(x,2):x)).join(' / ').replace(/^(– \/ )*–$/,'');
  if(['num','calc','carry'].includes(col.type))return typeof v==='number'?fmt(v,col.dp??2):esc(v??'');
  return esc(v??'');
}

    else r1+=`<th ${hasG?'rowspan="2"':''}>${esc(c.label)}</th>`}

function fieldHtml(col,v,reg){

  if(col.type==='date')return `<div class="fld">${L}<input type="date" id="${id}" name="${col.key}" value="${esc(v||'')}"></div>`;
  if(col.type==='num'||col.type==='carry')return `<div class="fld">${L}<input type="number" step="any" inputmode="decimal" id="${id}" name="${col.key}" value="${esc(v??'')}" ${col.type==='carry'?'placeholder="khaali = pichhli line se"':''}></div>`;
  if(col.type==='tri'){const a=v||[];return `<div class="fld">${L}<div style="display:flex;gap:6px">${[0,1,2].map(i=>`<input type="number" step="any" inputmode="decimal" aria-label="${esc(col.label)} cube ${i+1}" name="${col.key}.${i}" value="${esc(a[i]??'')}">`).join('')}</div></div>`}
  if(col.type==='calc')return `<div class="fld">${L}<div class="calcv" data-calc="${col.key}"></div></div>`;
  const long=col.wide||/Details|વિગત|વર્ણન|Remarks|નોંધ|Location|Structure|Placement/.test(col.label);
  if(col.list)return `<div class="fld">${L}<input id="${id}" name="${col.key}" value="${esc(v||'')}" list="dl_${col.key}"><datalist id="dl_${col.key}">${col.list.map(o=>`<option value="${o}">`).join('')}</datalist></div>`;

function readForm(){const d=formCtx.draft;$('#dlgBody').querySelectorAll('[name]').forEach(el=>{const n=el.name;

const MBV={items:'Tender Items',mbCover:'CMB Page 1–5',mbRecord:'For Record',mbAbstract:'Abstract'};
const UW={8:0.3950617283950617,10:0.617,12:0.89,16:1.58,20:2.47,25:3.86,32:6.32};
const MBDIAS=[8,10,12,16,20,25,32];
/* Excel ROUND jaisa: .5 hamesha shunya se door (-8.505 → -8.51) */
const r2=v=>{if(!v)return 0;const a=Math.abs(v);return Math.sign(v)*Math.round(+(a*100).toPrecision(12))/100};
const fdS=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
const fmt2=v=>v==null||isNaN(v)?'':Number(v).toFixed(2);
function mbOf(w=W()){w.mb??={};w.mb.cover??={};w.mb.bills??=[{id:uid(),name:'1st RA Bill',absTitle:'1st & RA BILL (ABSTRACT)'}];w.mb.entries??=[];w.items??=[];return w.mb}
const curBill=w=>{const mb=mbOf(w);let b=mb.bills.find(x=>x.id===view.bill);if(!b){b=mb.bills[mb.bills.length-1];view.bill=b.id}return b};
function itemOf(w,e){const it=(w.items||[]).find(i=>String(i.no)===String(e.itemNo));return it||{no:e.itemNo,desc:e.desc||'',unit:e.unit||'',qty:null}}
const isSteelUnit=u=>/kg|m\.?\s*t/i.test(u||'');
function lineQty(l){const v=[l.n1,l.n2,l.L,l.B,l.D].map(num).filter(x=>x!=null);return v.length?r2(v.reduce((a,b)=>a*b,1)):null}
function steelLen(l){const v=[l.n1,l.n2,l.L].map(num).filter(x=>x!=null);return v.length&&l.dia?r2(v.reduce((a,b)=>a*b,1)):null}
function entryCalc(w,e){const it=itemOf(w,e);
  if(e.steel){const len={},wt={};MBDIAS.forEach(d=>len[d]=0);(e.lines||[]).forEach(l=>{const x=steelLen(l);if(x!=null)len[+l.dia]=r2((len[+l.dia]||0)+x)});
    let kg=0;MBDIAS.forEach(d=>{wt[d]=r2(len[d]*((e.uw&&e.uw[d])||UW[d]));kg+=wt[d]});kg=r2(kg);
    const mt=/m\.?\s*t/i.test(it.unit||'');return {steel:true,len,wt,kg,qty:mt?Math.round(kg)/1000:kg,unit:it.unit||'Kg.'}}
  const q=r2((e.lines||[]).reduce((a,l)=>a+(lineQty(l)||0),0));return {qty:q,unit:it.unit||''}}
function mbLayout(w=W()){const mb=mbOf(w);const bi=Object.fromEntries(mb.bills.map((b,i)=>[b.id,i]));
  const ents=[...mb.entries].filter(e=>bi[e.bill]!=null).sort((a,b)=>bi[a.bill]-bi[b.bill]||((a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0)||(a._c||0)-(b._c||0));
  let p=5;const abs={};const out=[];
  mb.bills.forEach((b,k)=>{
    ents.filter(e=>e.bill===b.id).forEach(e=>{const pg=num(e.page)!=null?+e.page:p+1;p=Math.max(p,pg);out.push({...e,_page:pg,_calc:entryCalc(w,e)})});
    const upto=out.filter(e=>bi[e.bill]<=k);const items={};
    upto.forEach(e=>{const key=String(e.itemNo);(items[key]??={it:itemOf(w,e),rows:[],upto:0,prev:0});items[key].rows.push({page:e._page,qty:e._calc.qty});items[key].upto=r2(items[key].upto+e._calc.qty);if(bi[e.bill]<k)items[key].prev=r2(items[key].prev+e._calc.qty)});
    const list=Object.values(items).sort((a,b)=>(parseFloat(a.it.no)||0)-(parseFloat(b.it.no)||0)).map(x=>({...x,now:r2(x.upto-x.prev),limit:x.it.qty!=null&&x.upto>+x.it.qty?+x.it.qty:null}));
    const lines=list.reduce((a,x)=>a+2+Math.ceil((x.it.desc||'').length/120)+x.rows.length+3+(x.limit!=null?1:0),4);
    const n=list.length?Math.max(1,Math.ceil(lines/34)):0;abs[b.id]={list,start:p+1,pages:n};p+=n});
  return {entries:out,abs,bills:mb.bills}}

/* ===================== OFFICERS (date-wise) + STIPULATED DATE ===================== */
function officerOn(list,date){list=(list||[]).filter(o=>o&&o.name);if(!list.length)return null;
  if(date){const hit=list.find(o=>(!o.from||o.from<=date)&&(!o.to||date<=o.to));if(hit)return hit}
  return list[list.length-1]}
function aeOn(w,date){return officerOn(w.aeList,date)||{name:mbOf(w).cover.aeName||w.issuedTo||'',desig:'A.E.'}}
function agEngOn(w,date){return officerOn(w.agEngList,date)||{name:mbOf(w).cover.agencyEngineer||''}}
function autoStip(w){if(!w.startDate)return'';const t=w.timeLimit||'';const m=/(\d+)\s*(?:\([^)]*\))?\s*month/i.exec(t),d=/(\d+)\s*(?:\([^)]*\))?\s*day/i.exec(t);
  if(!m&&!d)return'';const x=new Date(w.startDate+'T00:00:00');if(m)x.setMonth(x.getMonth()+ +m[1]);if(d)x.setDate(x.getDate()+ +d[1]);x.setDate(x.getDate()-1);
  return new Date(x-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function stipOf(w){return w.stipDate||autoStip(w)}

  setTimeout(()=>{window.print();setTimeout(()=>document.title=t,500)},80)}

/* ===================== EXCEL (formulas inbuilt) ===================== */
const XL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const fname=s=>(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80);
async function xlSave(wb,name){if(typeof ExcelJS==='undefined')return toast('Excel library load nahi hui (internet chahiye)');
  const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=fname(name)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Excel ban gaya')}
const THIN={style:'thin'};const BOX={top:THIN,left:THIN,bottom:THIN,right:THIN};
function xc(ws,r,c,v,o={}){const cell=ws.getCell(r,c+1);
  if(v&&typeof v==='object'&&'f' in v)cell.value={formula:v.f,result:v.r??undefined};else cell.value=v===''||v==null?null:v;
  if(o.b)cell.font={bold:true,size:o.sz||10};else cell.font={size:o.sz||10};
  cell.alignment={vertical:'top',wrapText:o.wrap!==false,horizontal:o.h||(typeof v==='number'||(v&&v.f)?'right':'left')};
  if(o.box!==false&&o.box)cell.border=BOX;if(o.fill)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF2F8'}};if(o.nf)cell.numFmt=o.nf;return cell}
function newSheet(wb,name,land=true){const ws=wb.addWorksheet(name.replace(/[\\/?*[\]:]/g,'').slice(0,31),{pageSetup:{paperSize:9,orientation:land?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});return ws}
const nfOf=dp=>dp==null?'0.00':dp===0?'0':'0.'+'0'.repeat(dp);

/* ---- one register → sheet ---- */
function regSheet(wb,reg,w){const rows=compute(reg,w);const ws=newSheet(wb,reg.short);
  const ttl=(r,t,ncol)=>{ws.mergeCells(r,1,r,ncol);xc(ws,r,0,t,{b:true,h:'center',sz:12})};
  if(reg.layout==='steelBlock')return steelBlockSheet(ws,reg,rows,w,ttl);
  if(reg.layout==='sieve')return sieveSheet(ws,reg,rows,w,ttl);
  const cols=reg.cols.filter(c=>!c.formOnly);const n=cols.length;const hasG=cols.some(c=>c.grpH);
  ttl(1,reg.title,n);ws.mergeCells(2,1,2,n);xc(ws,2,0,'Name of Work: '+(w.name||''),{});
  let r=4;
  cols.forEach((c,j)=>{if(c.grpH){xc(ws,r,j,c.grpH,{b:true,box:1,fill:1,h:'center'});xc(ws,r+1,j,c.label,{b:true,box:1,fill:1,h:'center'})}else{xc(ws,r,j,c.label,{b:true,box:1,fill:1,h:'center'});if(hasG){xc(ws,r+1,j,'',{box:1,fill:1});ws.mergeCells(r,j+1,r+1,j+1)}}});
  if(hasG){let j=0;while(j<n){const g=cols[j].grpH;if(g){let k=j;while(k+1<n&&cols[k+1].grpH===g)k++;if(k>j)ws.mergeCells(r,j+1,r,k+1);j=k+1}else j++}r+=2}else r+=1;
  cols.forEach((c,j)=>xc(ws,r,j,c.no,{box:1,h:'center',sz:8}));r++;
  const first=r;const L={};cols.forEach((c,j)=>L[c.key]=XL(j));
  // group info for day-group registers
  const gStart={},gEnd={};if(reg.layout==='dayGroup'){let s=null;rows.forEach((c,i)=>{if(c._first)s=i;gStart[i]=s;let e=i;while(e+1<rows.length&&!rows[e+1]._first)e++;gEnd[i]=e})}
  rows.forEach((c,i)=>{const rr=first+i;const R=(k,dr=0)=>L[k]+(rr+dr);
    const ctx={R,L,row:rr,i,first:first,prevRow:i?rr-1:null,gS:first+(gStart[i]??i),gE:first+(gEnd[i]??i),c};
    cols.forEach((col,j)=>{let v=c[col.key];let cell;
      if(col.type==='sign'){xc(ws,rr,j,'',{box:1});return}
      if((col.only==='first'&&!c._first)||(col.only==='last'&&!c._last)){xc(ws,rr,j,'',{box:1});return}
      if(col.type==='sr'){xc(ws,rr,j,i+1,{box:1,h:'center'});return}
      if(col.type==='date'||col.date){xc(ws,rr,j,fdate(v),{box:1});return}
      const own=num(c.__raw?.[col.key]);
      if(col.type==='carry'&&own==null&&col.xf){xc(ws,rr,j,{f:col.xf(ctx),r:typeof v==='number'?v:undefined},{box:1,nf:nfOf(col.dp)});return}
      if(col.type==='calc'&&col.xf){const f=col.xf(ctx);if(f){xc(ws,rr,j,{f,r:typeof v==='number'?v:undefined},{box:1,nf:nfOf(col.dp)});return}}
      if(Array.isArray(v))v=v.map(x=>typeof x==='number'?x.toFixed(2):x).join(' / ');
      xc(ws,rr,j,typeof v==='number'?+v.toFixed(col.dp??3):(v??''),{box:1,nf:typeof v==='number'?nfOf(col.dp):undefined})})});
  cols.forEach((c,j)=>ws.getColumn(j+1).width=c.type==='sr'?6:c.type==='sign'?10:/date/.test(c.type)||c.date?11:['num','calc','carry'].includes(c.type)?10:Math.min(34,Math.max(12,(c.label||'').length*0.6)));
  ws.pageSetup.printTitlesRow=`4:${first-1}`;return ws}
function steelBlockSheet(ws,reg,rows,w,ttl){const n=3+DIAS.length+1;ttl(1,reg.title,n);ws.mergeCells(2,1,2,n);xc(ws,2,0,'Name of Work: '+(w.name||''));
  let r=4;['ક્રમ','વિગત','તારીખ',...DIAS.map(d=>d+'ø (મે.ટન)'),'વિશેષ નોંધ'].forEach((h,j)=>xc(ws,r,j,h,{b:true,box:1,fill:1,h:'center'}));r++;
  let prevClose=null;

function dayRate(desc,unit){const d=desc.toLowerCase();
  if(/kg/i.test(unit||'')&&/steel|tmt|reinforce|\bbar/.test(d))return 1500;
  if(/half brick/.test(d))return 40;if(/brick/.test(d))return 8;if(/plaster/.test(d))return 60;if(/foundation|footing|mass concrete/.test(d))return 30;
  if(/slab/.test(d))return 120;if(/plinth/.test(d)&&/beam/.test(d))return 30;if(/beam/.test(d))return 60;if(/column|pillar/.test(d))return 10;
  if(/stair/.test(d))return 4;if(/lintel/.test(d))return 3;return 30}
function elemName(desc){const d=desc.toLowerCase();const g=(CEM_STD.find(s=>s.k.test(desc))||{}).lab||'';
  const e=/half brick/.test(d)?'Half brick masonry':/brick/.test(d)?(/in foundation|foundation and plinth/.test(d)?'Brick work (foundation)':'Brick work'):/plaster/.test(d)?'Plaster':

  g.rows.forEach(row=>{row=row||[];const txt=row.map(v=>typeof v==='string'?v:'');

    if(im){close();blk={itemNo:im[1],desc:'',total:null,unit:'',uw:null,first:null,pushed:false};cur=mk(null);return}

    if(!cur)cur=mk(date);

const uref=()=>fb.collection('users').doc(user.uid);
async function cloudPull(){try{
  const ws=await uref().collection('works').get();
  if(ws.empty){await cloudPushAll();toast('Data aapke account mein save ho gaya');return}
  const works=[],data={};
  for(const d of ws.docs){const w=d.data();works.push(w.info);data[w.info.id]={};
    const rs=await d.ref.collection('regs').get();rs.forEach(r=>data[w.info.id][r.id]=r.data().rows||[])}
  state={works,data,cur:works.some(w=>w.id===state.cur)?state.cur:works[0].id};
  try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}render()}catch(e){toast('Sync error: '+e.message)}}
async function cloudPushAll(){for(const w of state.works){await uref().collection('works').doc(w.id).set({info:w});
  for(const k in (state.data[w.id]||{}))await uref().collection('works').doc(w.id).collection('regs').doc(k).set({rows:state.data[w.id][k],at:Date.now()})}
  await uref().set({worksCount:state.works.length},{merge:true})}
const dirty=new Set();
function cloudPush(regId){if(!fb||!user)return;const w=W();dirty.add(w.id+'|'+(regId||''));clearTimeout(pushT);
  pushT=setTimeout(async()=>{try{for(const k of dirty){const[wid,rid]=k.split('|');const wo=state.works.find(x=>x.id===wid);if(!wo)continue;
    const ref=uref().collection('works').doc(wid);await ref.set({info:wo});
    if(rid)await ref.collection('regs').doc(rid).set({rows:state.data[wid][rid]||[],at:Date.now()})}dirty.clear();uref().set({worksCount:state.works.length},{merge:true})}catch(e){toast('Sync error: '+e.message)}},800)}
async function cloudDropWork(id){if(!fb||!user)return;try{const ref=uref().collection('works').doc(id);const rs=await ref.collection('regs').get();for(const d of rs.docs)await d.ref.delete();const ms=await ref.collection('mbfiles').get();for(const d of ms.docs)await d.ref.delete();await ref.delete()}catch(e){}}

const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function fileToBlocks(f){const buf=await f.arrayBuffer();
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name))return [{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64(buf)}}];
  if(/^image\//.test(f.type))return [{type:'image',source:{type:'base64',media_type:f.type,data:b64(buf)}}];
  if(/\.xlsx$/i.test(f.name)){if(typeof ExcelJS==='undefined')throw new Error('Excel library load nahi hui');const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);let t='';
    wb.eachSheet(ws=>{if(ws.state==='hidden')return;t+=`\n### Sheet: ${ws.name}\n`;ws.eachRow({includeEmpty:false},row=>{const v=[];row.eachCell({includeEmpty:true},c=>{let x=c.value;if(x&&typeof x==='object')x=x.result??x.text??x.richText?.map(r=>r.text).join('')??'';v.push(String(x??'').replace(/\s+/g,' ').trim())});t+=v.join('\t').replace(/\t+$/,'')+'\n'})});
    return [{type:'text',text:'Excel file ka data (tab-separated):\n'+t.slice(0,180000)}]}
  throw new Error('Ye file type nahi chalega. PDF, photo (jpg/png) ya .xlsx do. Word file ho to PDF bana ke do.')}

      else{const ch=applyFields(w,type,d);
        chat.msgs.push({role:'bot',type,data:d,html:ch.length?`<b>${DOCT[type]} se ye mila:</b><table class="kv">${ch.map(x=>`<tr><td>${esc(x.label)}</td><td><b>${esc(x.k.match(/date/i)?fdS(x.v):x.v)}</b>${x.old&&x.old!==x.v?`<div class="note">abhi: ${esc(x.k.match(/date/i)?fdS(x.old):x.old)}</div>`:''}</td></tr>`).join('')}</table><button class="btn primary small" data-apply="${i}">Theek hai, save karo</button>`:'Is file mein kaam ki vigat nahi mili. Sahi file aur type chuna hai?'})}}
    else{const hist=chat.msgs.filter(m=>m.role==='user'||m.answer).slice(-8).map(m=>({role:m.role==='user'?'user':'assistant',content:m.role==='user'?m.text:m.answer}));
      const t=await callAI({max:1500,system:`Tum Gujarat R&B (Dahod) ke Deputy Executive Engineer ke site assistant ho. Hinglish mein chhota, seedha jawab do. Sirf neeche diye data se jawab do; data mein na ho to saaf bolo ki app mein ye data nahi hai. Kaam ka data (JSON): ${ctxSummary(w)}`,messages:hist});
      chat.msgs.push({role:'bot',answer:t,text:t})}
  }catch(e){chat.msgs.push({role:'bot',text:'Dikkat: '+e.message})}
  chat.busy=false;chat.files=[];renderChat();$('#c_text').value=''}
function applyResult(i){const m=chat.msgs[i];const w=W();
  if(m.type==='mb')return openMbFillAll();
  if(m.type==='mix'){w.mix??={};const map=g=>{const x=String(g).toUpperCase().replace(/\s/g,'');const n=/M-?(\d+)/.exec(x);return n?(+n[1]===15?'M15 / 1:2:4':'M'+n[1]):String(g)};
    m.data.mixes.forEach(x=>{const k=map(x.grade);w.mix[k]={cement:num(x.cement),sand:num(x.sand),a20:num(x.a20),a10:num(x.a10),water:num(x.water),ref:x.labRef||''};Object.keys(w.mix[k]).forEach(z=>w.mix[k][z]==null&&delete w.mix[k][z])});
    persist();m.html=m.html.replace(/<button[^>]*data-apply[^>]*>.*?<\/button>/,'<span class="chip ok">Save ho gaya</span>');renderChat();toast('Mix design save – Aavak planning dekho');return}
  if(m.type==='boq'){m.data.items.forEach(x=>{const o={id:uid(),no:String(x.no).trim(),qty:num(x.qty),unit:x.unit||'',rate:num(x.rate),desc:x.desc};const k=w.items.findIndex(y=>String(y.no)===o.no);if(k>=0){o.id=w.items[k].id;w.items[k]=o}else w.items.push(o)});
    w.items.sort((a,b)=>(parseFloat(a.no)||0)-(parseFloat(b.no)||0));toast(m.data.items.length+' items Tender Items mein save')}
  else if(m.type==='estimate'){w.estItems=m.data.items;toast(m.data.items.length+' estimate items save')}
  else applyFields(w,m.type,m.data).forEach(x=>x.o[x.k]=x.v),toast('Kaam ki vigat mein save ho gaya');
  persist();m.html=m.html.replace(/<button[^>]*data-apply[^>]*>.*?<\/button>/,'<span class="chip ok">Save ho gaya</span>');renderChat()}

render();initFirebase();
if(!EMBED&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
