<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R&amp;B Site Registers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hind+Vadodara:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-book app — work bar on top, register shelf on the left, ruled register sheet on the right */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --rule:#E5E7EB; --rule-strong:#CBD2DC;
  --accent:#1E3A8A; --accent-2:#0F2557; --accent-soft:#EEF2FB; --head:#F4F6FA;
  --bad:#B42318; --bad-soft:#FDECEA; --warn:#A15C07; --warn-soft:#FEF4E2; --ok:#067647; --ok-soft:#E7F6EE;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --f-ui:"Inter","Hind Vadodara","Noto Sans Gujarati","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:.86em}
header.top{position:relative;z-index:6;background:var(--surface);border-top:4px solid var(--accent);border-bottom:1px solid var(--rule);
  padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand i{width:38px;height:38px;border-radius:8px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;color:var(--accent-2)}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.workpick{display:flex;gap:8px;align-items:center;flex:1 1 360px;min-width:0}
.workpick select{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-weight:500}
.btn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.primary:hover{color:#fff;background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.navitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sync{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
nav.shelf{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--rule);box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navbar{display:flex;align-items:stretch;gap:2px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
.tab{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink);font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--accent);background:var(--accent-soft)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .car{font-size:9px;opacity:.55}
.tab .cnt{font-family:var(--f-num);font-size:11px;color:var(--muted);background:var(--head);border-radius:10px;padding:0 7px}
.navbar .spacer{flex:1}
.dd{position:relative;display:flex}
.dd .menu{display:none;position:absolute;top:100%;left:0;min-width:340px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;z-index:20}
.dd.open .menu{display:block}
@media (hover:hover){.dd:hover .menu{display:block}}
.menu h4{margin:6px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.navitem{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px}
.navitem:hover{background:var(--accent-soft);color:var(--accent)}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .cnt{font-family:var(--f-num);font-size:11.5px;color:var(--muted);background:var(--head);border-radius:10px;padding:0 7px;min-width:24px;text-align:center}
.shelf .mobsel{display:none;width:100%;margin:10px 0;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--surface);font-weight:600}
.navitem .dot,.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-left:4px}
.app{max-width:1500px;margin:0 auto;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.sheethead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.sheethead h2{margin:0;font-size:22px;line-height:1.3;text-wrap:balance;font-weight:700;color:var(--accent-2);letter-spacing:-.01em}
.sheethead .sub{color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid #F3D19C;border-left:4px solid var(--warn);border-radius:8px;padding:9px 12px;font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:13.5px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
table.reg{border-collapse:collapse;width:100%;font-size:13.5px}
table.reg th,table.reg td{border:1px solid var(--rule);padding:6px 8px;vertical-align:top}
table.reg thead th{background:var(--head);font-weight:600;font-size:12.5px;line-height:1.35;text-align:center;vertical-align:middle;color:#374151}
table.reg tbody tr:nth-child(even) td{background:#FAFBFD}
table.reg thead tr.colno th{font-family:var(--f-num);font-weight:400;font-size:11px;color:var(--muted);padding:2px}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:hover td{background:var(--accent-soft)}
table.reg td.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
table.reg td.calc{color:var(--accent)}
table.reg td.d{white-space:nowrap;font-family:var(--f-num);font-size:12.5px}
table.reg td.sg{min-width:56px}
table.reg tr.blk1 td{border-top:2px solid var(--rule-strong)}
table.reg td.lbl{font-size:13px;min-width:190px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}
td.flagcell{min-width:110px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);border-left:3px solid var(--accent)}
.card .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.card .v{font-size:24px;font-weight:600;font-family:var(--f-num);color:var(--accent-2)}
.list{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--rule);flex-wrap:wrap;align-items:center}
.list .li:first-child{border-top:0}
.list h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--rule);background:var(--head);color:var(--accent-2)}
dialog{border:1px solid var(--rule);border-radius:12px;box-shadow:0 24px 48px rgba(16,24,40,.18);padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dlg header{padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--head);display:flex;justify-content:space-between;gap:10px;align-items:center}
.dlg header h3{margin:0;font-size:16px;color:var(--accent-2)}
.dlg .body{padding:14px 16px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.dlg footer{padding:10px 16px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--muted);line-height:1.3}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--rule-strong);border-radius:7px;background:var(--surface);width:100%}
.fld .calcv{padding:7px 9px;border:1px dashed var(--rule-strong);border-radius:5px;color:var(--accent);font-family:var(--f-num);font-size:13px;min-height:36px}
.offrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grpttl{grid-column:1/-1;font-weight:600;font-size:13px;border-bottom:1px solid var(--rule);padding-bottom:3px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:14px;z-index:50}
#printArea{display:none}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#gate[hidden]{display:none}
.gcard{background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:26px 24px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.gbody{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.chatlog{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:12px;min-height:280px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex}.msg.user{justify-content:flex-end}
.msg .bub{max-width:min(720px,92%);padding:9px 12px;border-radius:10px;background:var(--head);min-width:0;overflow-wrap:anywhere}
.msg.user .bub{background:var(--accent-soft)}
table.kv{border-collapse:collapse;margin:6px 0}table.kv td{padding:3px 10px 3px 0;vertical-align:top}
.composer{display:flex;flex-direction:column;gap:8px}.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crow textarea{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface)}
.crow select{padding:7px 9px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.mbpages{display:flex;flex-direction:column;gap:18px}
.mbsheet{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);padding:18px 20px;font-size:13px;min-width:0}
.mbsheet .tablewrap{border:0}
.mbtop{display:flex;justify-content:space-between}.mbtop .r,.mbsign .r{text-align:right}
.mbt,.mbt2{text-align:center;font-weight:700;margin:6px 0}.mbt2{text-decoration:underline}
.mbinfo{margin:4px 0 10px;line-height:1.6}
table.mbt-rec td.desc{white-space:normal}table.mbt-rec tr.ih td{border-top:2px solid var(--rule-strong)}
table.mbt-rec td.lbl{text-align:right;font-weight:600;white-space:nowrap}table.mbt-rec tr.tot td{font-weight:700}
table.mbt-rec td.n{text-align:right;font-family:var(--f-num);font-size:12px}table.mbt-rec tr.gap td{height:14px;border-left:0;border-right:0}
.mbsign{display:flex;justify-content:space-between;margin-top:26px;gap:20px}
.absit{margin:10px 0 4px}.absit .desc{margin:2px 0 4px 0}
table.absq{border-collapse:collapse;margin-left:24px}table.absq td{padding:1px 10px}table.absq td.n{text-align:right;font-family:var(--f-num);min-width:70px}
table.absq tr.lim td{font-weight:700}
.cv{font-family:"Times New Roman",Georgia,serif;min-height:520px;position:relative}
.cv1{font-weight:700;font-size:18px;margin:60px 0 0 40px}.cvee{position:absolute;left:90px;bottom:120px;text-align:center}
table.cvt{border-collapse:collapse;margin-top:16px}table.cvt td{padding:12px 6px;vertical-align:top}table.cvt td.k{font-weight:700;white-space:nowrap}table.cvt.sm td{padding:6px}
.cvt .red{color:var(--bad)}
.cvsig{display:flex;justify-content:space-around;text-align:center;font-size:12px;margin-top:40px}.cvsig.r{justify-content:flex-end}
.cvh{text-align:center;font-weight:700;text-decoration:underline;margin:30px 0 16px}
.cvp{text-indent:60px;line-height:1.6}
table.cvg{border-collapse:collapse;width:100%;font-size:12px}table.cvg th,table.cvg td{border:1px solid var(--ink);padding:5px;vertical-align:top}
table.ln td{padding:2px}table.ln input,table.ln select{padding:4px 5px;border:1px solid var(--rule-strong);border-radius:4px;background:var(--surface);width:100%;min-width:56px}
@media (max-width:860px){
  .navbar{display:none}
  .shelf .mobsel{display:block}
  .app{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-top:16px}
  header.top{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .brand small{display:none}
  .workpick{flex-wrap:wrap}.workpick select{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- print (A4 landscape register) ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  @page cover{size:A4 portrait;margin:14mm}
  .pg.portrait{page:cover}
  .pg .mbtop,.pg .mbinfo{font-size:11px}.pg .mbt,.pg .mbt2{font-size:12px}
  table.p.mbt-rec{font-size:9.5px}table.p.mbt-rec td{border:0;border-left:1px solid #000;border-right:1px solid #000;padding:1px 4px}table.p.mbt-rec{border:1px solid #000}
  table.p.mbt-rec tr.ih td{border-top:1px solid #000}table.p.mbt-rec td.n{text-align:right}
  .pg.cv{font-family:"Times New Roman",serif;font-size:13px;position:relative;height:260mm}
  .pg .cvee{position:absolute;left:30mm;bottom:60mm;text-align:center}.pg .cvsig{position:absolute;left:0;right:0;bottom:30mm}
  .pg table.cvg td,.pg table.cvg th{border:1px solid #000}.pg .red{color:#c00}
  .pg .absit{font-size:10px;margin:3px 0;page-break-inside:avoid}.pg table.absq td{padding:0 8px;font-size:10px}.pg .mbsign{margin-top:14px;font-size:10.5px}
  body{background:#fff;color:#000;font-size:11px}
  body::before{display:none}
  header.top,nav.shelf,.app,dialog,.toast{display:none!important}
  #printArea{display:block}
  .pg{page-break-after:always;padding:6mm 4mm}
  .pg:last-child{page-break-after:auto}
  .cover{text-align:center;padding-top:30mm}
  .cover h1{font-size:26px;margin:0 0 6px}
  .cover table{margin:18mm auto 0;border-collapse:collapse;width:70%;font-size:13px;text-align:left}
  .cover td{border:1px solid #000;padding:7px 10px}
  table.p{border-collapse:collapse;width:100%;font-size:10px}
  table.p.xg{table-layout:auto;font-size:9px}table.p.xg td{white-space:normal}
  table.p th,table.p td{border:1px solid #000;padding:3px 4px;vertical-align:top}
  table.p th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p td.n{text-align:right}
  table.p tr.blk1 td{border-top:2px solid #000}
  .ph{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
  .ph h2{font-size:15px;margin:0;text-align:center;flex:1}
}
.fld label.chk{display:flex;flex-direction:row;gap:8px;align-items:center;margin:2px 0;font-size:13.5px;color:var(--ink,inherit)}
.fld label.chk input{width:auto;padding:0}
.fld label.chk input[data-fq]{padding:4px 6px}
.xgw{max-height:75vh}
.fchips{display:flex;flex-wrap:wrap;gap:6px}.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-2);border-radius:14px;padding:3px 6px 3px 10px;font-size:13px}.fchip button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--muted)}
.dropping{outline:3px dashed var(--accent);outline-offset:6px;border-radius:10px;background:var(--accent-soft)}
table.xg{border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.xg td{border:1px solid var(--rule);padding:3px 6px;vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
table.xg td.n{text-align:right;font-family:var(--f-num);font-size:12px;white-space:nowrap}
table.xg td.b{font-weight:700}
.segs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.list .li.sel{background:var(--accent-soft)}
dialog:has(#mbxBody){width:min(1180px,calc(100vw - 24px))}
.mbxg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:4px 18px;margin-top:4px}
</style>

<header class="top">
  <div class="brand"><i>R&amp;B</i><span><b>Site Registers &amp; MB</b><small>Roads &amp; Buildings Sub Division, Dahod</small></span></div>
  <div class="workpick">
    <select id="workSel" aria-label="Select work"></select>
    <button class="btn" id="workEdit">Work details</button>
    <button class="btn" id="workNew">+ New work</button>
  </div>
  <div class="sync" id="syncBox"></div>
</header>

<nav class="shelf" id="shelf" aria-label="Registers"></nav>
<div class="app">
  <main id="main"></main>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog">
  <header><h3 id="dlgTitle"></h3><button type="button" class="btn small" id="dlgClose">Close</button></header>
  <div class="body" id="dlgBody"></div>
  <footer><div><button type="button" class="btn danger" id="dlgDel" hidden>Delete</button></div>
    <div class="actions"><button type="button" class="btn" id="dlgCancel">Cancel</button><button type="submit" class="btn primary" id="dlgSave">Save</button></div></footer>
</form></dialog>

<div id="printArea"></div>
<div class="toast" id="toast" hidden></div>
<div id="gate" hidden><div class="gcard"><div class="brand"><i>R&amp;B</i> Site Registers</div><div class="gbody"></div></div></div>

function gradeCheck(c){let spec=c.spec||'20 mm graded (IS 383)';
  const chk=sp=>{const g=GRADING[sp];let ok=true,any=false;SIEVES.forEach((sv,i)=>{const lim=g[sv];const v=c['pp'+i];if(lim&&v!=null){any=true;if(v<lim[0]-1e-9||v>lim[1]+1e-9)ok=false}});return any?ok:null};
  if(/^Sand \(/.test(spec)){const z=['Sand Zone I','Sand Zone II','Sand Zone III','Sand Zone IV'].find(z=>chk(z));spec=z||'Sand Zone II';return {spec,ok:!!z,auto:true}}
  return {spec,ok:chk(spec)}}
const toMpa=(v,u)=>{const x=num(v);if(x==null)return null;return /N\/mm/.test(u||'')?x:x*1000/22500};

  C('dim','ડાયમેન્શન ટોલરન્સ','calc',{fn:r=>{if(r.dL==null&&r.dW==null&&r.dH==null)return'';const t=brickTol(r.btype);const f=(v,[a,b])=>v==null?'–':`${v}${v<a||v>b?' ✗':' ✓'}`;return `L ${f(r.dL,t.L)} · W ${f(r.dW,t.W)} · H ${f(r.dH,t.H)}`}}),
  C('remarks','રીમાર્કસ')],
 flag:r=>{const c=+(r.cls||3.5),req=c*10,waMax=c<=12.5?20:15,effOk=c<=12.5?['','Nil','Slight','Moderate']:['','Nil','Slight'];
  if(r.cs!=null&&r.cs<req)return['bad',`Average strength below ${req}`];
  if(r.csMin!=null&&r.csMin<req)return['bad','A brick is below class – lower class'];
  if(r.wa!=null&&r.wa>waMax)return['bad',`Absorption above ${waMax}%`];
  if(!effOk.includes(r.eff||''))return['bad','Efflorescence too high'];
  if(/✗/.test(r.dim||''))return['bad','Dimensions outside tolerance'];
  return r.cs!=null?['ok',`Class ${c} OK`]:null}},

{id:'tiles',grp:'Material Testing',short:'Cement Tiles Testing Patrak-5',gu:true,

{id:'aggTest',grp:'Material Testing',short:'Aggregate Test Results',gu:true,

 note:'IS 383 limits for building concrete: impact value ≤45% (RCC/PCC) / ≤30% (wearing surfaces such as floors); abrasion (Los Angeles) ≤50% / ≤30%; combined flakiness + elongation ≤40%; soundness test required if water absorption exceeds 2%. (Remarks printed in the book are for road works and do not apply here.)',sortKey:'_c',
 cols:[C('_sr','અનુક્રમ નંબર','sr'),C('sample','નમુનાની વિગત ખાણ અને રસ્તાની કિ.મી. / સ્થળ'),C('gradeGrp','ગ્રેઈડ ગ્રુપ'),

  C('sg','સ્પેશીફીક ગ્રેવીટી','num',{dp:2}),
  C('wa','વોટર એબ્સોર્પશન','num',{dp:2}),C('iv','ઈમ્પેક્ટ વેલ્યુ ટકા','num',{dp:1}),C('av','એબ્રેશન વેલ્યુ ટકા','num',{dp:1}),C('sound','સાઉન્ડનેસ'),
  C('fi','ફ્લેકીનેસ ઈન્ડેક્ષ ટકા (FI+EI)','num',{dp:1}),C('remarks','રીમાર્કસ')],
 flag:r=>{const w=/Wearing/.test(r.use||'');const iv=w?30:45,av=w?30:50;

{id:'sieve',grp:'Material Testing',short:'Sieve Analysis (Aggregate)',gu:true,layout:'sieve',
 title:'મેટલ, કપચી, ગ્રેવલ વગેરેના સીવ એનાલીસીસના પરિણામો',
 note:'Enter the weight retained (g) on each sieve. Cumulative and percentage passing are calculated automatically. The remarks column shows the IS 383 limits and ✓/✗. For sand choose "Sand (zone auto-detected)".',sortKey:'date',
 cols:[C('date','તારીખ','date'),C('material','માલનો પ્રકાર','sel',{options:['મેટલ','કપચી','ગ્રેવલ','ગ્રીટ','રેતી']}),C('lab','લેબોરેટરી નંબર / તારીખ'),
  C('totalWt','કુલ વજન ગ્રામ','num',{dp:0}),C('spec','IS 383 grading to compare','sel',{options:SPECS}),
  ...SIEVES.map((sv,i)=>C('w'+i,sv,'num',{dp:0,sec:'દરેકનું અલગ વજન (ગ્રામ)'})),C('remarks','રીમાર્કસ','text',{wide:true})],
 compute(rows){return rows.map(r=>{const c={...r};const ws=SIEVES.map((_,i)=>num(r['w'+i]));const sum=ws.reduce((a,v)=>a+(v||0),0);
   const T=num(r.totalWt)||sum;c._T=T;let cum=0;SIEVES.forEach((_,i)=>{const w=ws[i];if(w!=null)cum+=w;c['cw'+i]=w!=null||cum?cum:null;c['cp'+i]=T&&c['cw'+i]!=null?cum/T*100:null;c['pp'+i]=c['cp'+i]!=null?100-c['cp'+i]:null});
   c._diff=num(r.totalWt)&&sum?sum-num(r.totalWt):null;c._g=gradeCheck(c);return c})},
 flag:r=>{if(!SIEVES.some((_,i)=>num(r['w'+i])!=null))return null;if(r._diff&&r._diff/r._T>0.01)return['warn',`Retained weight exceeds total by ${fmt(r._diff,0)} g`];const g=r._g;if(!g||g.ok==null)return null;
  return g.ok?['ok',(g.auto?g.spec+' – ':'')+'IS 383 OK']:['bad',g.auto?'Does not fall in any zone':'Outside grading limits']}},

{id:'cube3',grp:'Concrete',short:'Cube Testing Patrak-3',gu:true,
 title:'કોંક્રીટના ક્યુબના ટેસ્ટીંગ પરિણામો દર્શાવતું પત્રક - ૩',
 note:'One line per day of concreting. Entering the quantity gives the number of samples (and cubes) required by IS 456 cl. 15.2.2 – 6 cubes per sample (3 for 7 days, 3 for 28 days); choose 3 in the form if only the 28-day test is done. 7/28-day due dates are shown on the Dashboard. Enter readings in kN (150 mm cube) or N/mm²; the register prints kg/cm² (×10.197). Columns 12/13: 28 days = fck, 7 days = 2/3 fck (indicative only; acceptance under IS 456 is at 28 days). Acceptance per IS 456 Table 11: each set ≥ fck−4 (M20 and above) / fck−3 (M15); mean of 4 sets ≥ fck+4 / fck+3. A sample is invalid if any cube differs from the set average by more than ±15% (cl. 15.4).',
 sortKey:'date',
 cols:[C('_sr','અનુક્રમ નંબર','sr'),C('date','ક્યુબ લીધાની તારીખ','date'),
  C('grade','Grade (M20/M25...)','sel',{options:['',...GRADES],formOnly:true}),
  C('mark','ક્યુબ ઉપરનું નિશાન તથા કોન્ક્રીટના વપરાશનું સ્થળ'),
  C('qty','ટેન્ડર મુજબ થયેલ કામનો રોજિંદો જથ્થો (ઘ.મી.)','num',{dp:2}),
  C('cps','Cubes per sample','sel',{options:['6 (3 – 7 days + 3 – 28 days)','3 (28 days only)'],formOnly:true}),
  C('reqNos','કામની નિર્દિષ્ઠ વિગતો પ્રમાણે ક્યુબ લેવાની સંખ્યા','calc',{dp:0,fn:r=>reqSamples(r.qty)*cpsOf(r)||null,xf:x=>{const q=x.R('qty');return `IF(${q}="","",${cpsOf(x.c)}*IF(${q}<=5,1,IF(${q}<=15,2,IF(${q}<=30,3,IF(${q}<=50,4,4+ROUNDUP((${q}-50)/50,0))))))`}}),
  C('cubesN','લીધેલ ક્યુબની સંખ્યા','num',{dp:0,formOnly:true}),C('cubeSize','ક્યુબનું માપ','text',{formOnly:true,def:'15 સે.મી.'}),
  C('cubes','લેવામાં આવેલ ક્યુબના સંખ્યા તથા માપ','calc',{fn:r=>r.cubesN!=null?`${r.cubesN} નંગ, ${r.cubeSize||''}`:''}),
  C('curing','ક્યોરીંગનો સમય ગાળો'),
  C('lab','ક્યુબ ટેસ્ટ કર્યાની તારીખ અને લેબોરેટરી નંબર'),
  C('density','કોન્ક્રીટની ઘનતા ગ્રામ / સી.સી.','num',{dp:2}),
  C('unit','Reading unit','sel',{options:['kN (CTM dial)','N/mm²'],formOnly:true}),
  C('r7','7 દિવસ – 3 cube reading','tri',{formOnly:true}),C('r28','28 દિવસ – 3 cube reading','tri',{formOnly:true}),
  C('n7','7 days N/mm² (each cube)','calc',{tri:true,formOnly:true,fn:r=>(r.r7||[]).map(v=>toMpa(v,r.unit))}),
  C('n28','28 days N/mm² (each cube)','calc',{tri:true,formOnly:true,fn:r=>(r.r28||[]).map(v=>toMpa(v,r.unit))}),
  C('a7','૭ દિવસના અંતે','calc',{dp:0,grpH:'ક્યુબની મજબુતાઈ કિલો/સે.મી.²',fn:r=>{const a=avg(r.n7||[]);return a==null?null:a*KGF}}),
  C('a28','૨૮ દિવસના અંતે','calc',{dp:0,grpH:'ક્યુબની મજબુતાઈ કિલો/સે.મી.²',fn:r=>{const a=avg(r.n28||[]);return a==null?null:a*KGF}}),
  C('q7','૭ દિવસના અંતે','calc',{dp:0,grpH:'ડિઝાઈ કોડ પ્રમાણે જરૂરિયાત કિલો/સે.મી.²',fn:r=>fck(r.grade)?2/3*fck(r.grade)*KGF:null}),
  C('q28','૨૮ દિવસના અંતે','calc',{dp:0,grpH:'ડિઝાઈ કોડ પ્રમાણે જરૂરિયાત કિલો/સે.મી.²',fn:r=>fck(r.grade)?fck(r.grade)*KGF:null}),
  C('t7','7-day test due','calc',{date:true,formOnly:true,fn:r=>addDays(r.date,7)}),C('t28','28-day test due','calc',{date:true,formOnly:true,fn:r=>addDays(r.date,28)}),
  C('remarks','રીમાર્કસ સહી')],
 flag:r=>{const f=fck(r.grade);const m28=avg(r.n28||[]),m7=avg(r.n7||[]);
  const sp=(a,s)=>a&&s.filter(v=>v!=null).some(v=>Math.abs(v-a)/a>0.15);
  if(r.reqNos&&r.cubesN!=null&&r.cubesN<r.reqNos)return['bad',`Insufficient cubes: ${r.reqNos} required`];
  const dd=f&&f<20?3:4;
  if(m28!=null&&f){if(sp(m28,r.n28||[]))return['warn','Cube differs by more than ±15% – sample invalid'];if(m28<f-dd)return['bad',`28d ${m28.toFixed(1)} N/mm² < fck−${dd}`];if(m28<f+dd)return['warn',`28d < fck+${dd}: check mean of 4 sets`];return['ok','28d OK']}
  if(m7!=null&&f)return m7<2/3*f?['warn',`7d ${m7.toFixed(1)} N/mm² (below 2/3 fck)`]:['ok','7d OK'];
  if(!f&&(m7!=null||m28!=null))return['warn','Enter grade'];
  return null}},

const W=()=>state.works.find(w=>w.id===state.cur)||state.works[0];
function rowsOf(regId,work=W()){if(!work)return[];state.data[work.id]??={};return state.data[work.id][regId]??=[]}

function sorted(reg,rows){const k=reg.sortKey||'_c';return [...rows].sort((a,b)=>{const x=(a[k]||'')+'', y=(b[k]||'')+'';return x<y?-1:x>y?1:(a._c||0)-(b._c||0)})}
function compute(reg,work=W()){
  const rows=sorted(reg,rowsOf(reg.id,work));
  if(reg.compute)return reg.compute(rows).map(c=>({...c,_flag:reg.flag?.(c)||null}));
  let prev=null;
  return rows.map((r,i)=>{const c={...r,_sr:i+1,__raw:r};
    for(const col of reg.cols){
      if(col.type==='calc')c[col.key]=col.fn(c,prev);
      else if(col.type==='carry'){const v=num(r[col.key]);c[col.key]=v!=null?v:col.fn(c,prev)}
      else if(col.type==='num'){const v=num(r[col.key]);c[col.key]=v}
    }
    c._flag=reg.flag?.(c)||null;prev=c;return c});
}

function cellVal(col,c,gu){
  const v=c[col.key];
  if((col.only==='first'&&!c._first)||(col.only==='last'&&!c._last))return'';
  if(col.type==='sr')return gd(v,gu);
  if(col.type==='sign')return'';
  if(col.type==='date'||col.date)return fdate(v);
  if(col.type==='tri'||col.tri)return (v||[]).map(x=>x==null||x===''?'–':(col.tri?fmt(x,2):x)).join(' / ').replace(/^(– \/ )*–$/,'');
  if(['num','calc','carry'].includes(col.type))return typeof v==='number'?fmt(v,col.dp??2):esc(v??'');
  return esc(v??'');
}
function headHtml(reg,cols,extra=false){
  const gu=reg.gu;const hasG=cols.some(c=>c.grpH);
  let r1='',r2='';
  for(let i=0;i<cols.length;i++){const c=cols[i];
    if(c.grpH){let j=i;while(j<cols.length&&cols[j].grpH===c.grpH)j++;r1+=`<th colspan="${j-i}">${esc(c.grpH)}</th>`;for(let k=i;k<j;k++)r2+=`<th>${esc(cols[k].label)}</th>`;i=j-1}
    else r1+=`<th ${hasG?'rowspan="2"':''}>${esc(c.label)}</th>`}
  if(extra)r1+=`<th ${hasG?'rowspan="2"':''}>Check</th>`;
  return `<thead><tr>${r1}</tr>${hasG?`<tr>${r2}</tr>`:''}<tr class="colno">${cols.map(c=>`<th>${gd(c.no,gu)}</th>`).join('')}${extra?'<th></th>':''}</tr></thead>`;
}
function tdClass(col){return col.type==='sign'?'sg':(col.type==='date'||col.date)?'d':['num','calc','carry'].includes(col.type)||col.tri||col.type==='tri'?'n'+(col.type==='calc'||col.type==='carry'?' calc':''):''}
function tableHtml(reg,rows,forPrint){
  if(reg.layout==='steelBlock')return steelBlockHtml(reg,rows,forPrint);
  if(reg.layout==='sieve')return sieveHtml(reg,rows,forPrint);
  const cols=reg.cols.filter(c=>!c.formOnly);
  let h=`<table class="${forPrint?'p':'reg'}">${headHtml(reg,cols,!forPrint)}<tbody>`;
  if(!rows.length&&!forPrint)h+=`<tr><td colspan="${cols.length+1}" class="empty">No entries yet. Click "+ New entry" to add the first line.</td></tr>`;
  for(const c of rows){
    h+=`<tr data-id="${c.id}">${cols.map(col=>{let v=cellVal(col,c,reg.gu);
      if(col.key==='cons'&&reg.id==='cement1'&&c.billDate)v+=`<div class="note">(up to ${fdate(c.billDate)})</div>`;
      return `<td class="${tdClass(col)}">${v}</td>`}).join('')}${forPrint?'':`<td class="flagcell">${c._flag?`<span class="chip ${c._flag[0]}">${esc(c._flag[1])}</span>`:''}</td>`}</tr>`}
  return h+'</tbody></table>';
}

  <tr>${D.map(d=>`<th>${g(d)}ø</th>`).join('')}</tr></thead><tbody>`;
  if(!rows.length&&!forPrint)h+=`<tr><td colspan="${D.length+5}" class="empty">No RA bill blocks yet. Click "+ New entry".</td></tr>`;
  for(const c of rows){
    const line=(n,lbl,pre,cls='')=>`<tr data-id="${c.id}" class="${cls}"><td>${g(n)}</td><td class="lbl">${lbl}</td><td class="d">${n===1||n===4?fdate(c.date):''}</td>${D.map(d=>{const v=c[pre+d];return `<td class="n ${pre!=='r'&&pre!=='u'?'calc':''}">${v?fmt(v,3):''}</td>`}).join('')}<td>${n===1?esc(c.remarks||''):''}</td>${forPrint?'':`<td class="flagcell">${n===1&&c._flag?`<span class="chip ${c._flag[0]}">${esc(c._flag[1])}</span>`:''}</td>`}</tr>`;
    h+=line(1,'ખુલતી સિલક','o','blk1')+line(2,'નવી આવકની વિગત<br>'+esc(c.supplier||''),'r')+line(3,'કુલ જથ્થો','t')
      +line(4,`<u>${esc(c.ra||'_____')}</u> રનીંગ બિલ બનાવ્યા તારીખે પત્રક-૨ મુજબ સ્ટીલના વપરાશનો જથ્થો`,'u')+line(5,'બંધ સિલક','c');

  const reg=REG[view.reg];const rows=compute(reg);

/* ===================== FORM ===================== */
let formCtx=null;
function fieldHtml(col,v,reg){
  const id='f_'+col.key;const L=`<label for="${id}">${col.no?gd(col.no,reg.gu)+'. ':''}${esc(col.grpH&&col.grpH.length<40?col.grpH+' – ':'')}${esc(col.label)}</label>`;
  if(col.type==='sel')return `<div class="fld">${L}<select id="${id}" name="${col.key}">${col.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(col.type==='date')return `<div class="fld">${L}<input type="date" id="${id}" name="${col.key}" value="${esc(v||'')}"></div>`;
  if(col.type==='num'||col.type==='carry')return `<div class="fld">${L}<input type="number" step="any" inputmode="decimal" id="${id}" name="${col.key}" value="${esc(v??'')}" ${col.type==='carry'?'placeholder="blank = carried from previous line"':''}></div>`;
  if(col.type==='tri'){const a=v||[];return `<div class="fld">${L}<div style="display:flex;gap:6px">${[0,1,2].map(i=>`<input type="number" step="any" inputmode="decimal" aria-label="${esc(col.label)} cube ${i+1}" name="${col.key}.${i}" value="${esc(a[i]??'')}">`).join('')}</div></div>`}
  if(col.type==='calc')return `<div class="fld">${L}<div class="calcv" data-calc="${col.key}"></div></div>`;
  const long=col.wide||/Details|વિગત|વર્ણન|Remarks|નોંધ|Location|Structure|Placement/.test(col.label);
  if(col.list)return `<div class="fld">${L}<input id="${id}" name="${col.key}" value="${esc(v||'')}" list="dl_${col.key}"><datalist id="dl_${col.key}">${col.list.map(o=>`<option value="${o}">`).join('')}</datalist></div>`;
  return `<div class="fld ${col.wide?'wide':''}">${L}${long?`<textarea rows="2" id="${id}" name="${col.key}">${esc(v||'')}</textarea>`:`<input id="${id}" name="${col.key}" value="${esc(v||'')}">`}</div>`;
}
function openForm(reg,row){
  const draft=row?JSON.parse(JSON.stringify(row)):{id:uid(),_c:Date.now()};
  if(!row){const dc=reg.cols.find(c=>c.type==='date');if(dc&&dc.key!=='billDate')draft[dc.key]=today();reg.cols.forEach(c=>{if(c.def)draft[c.key]=c.def})}
  formCtx={kind:'entry',reg,row,draft};
  $('#dlgTitle').textContent=(row?'Edit entry — ':'New entry — ')+reg.short;
  let h='',sec='';
  for(const col of reg.cols){if(col.type==='sr'||col.type==='sign')continue;
    if(col.sec&&col.sec!==sec){sec=col.sec;h+=`<div class="grpttl"><span>${esc(sec)}</span>${col.fill?`<button type="button" class="btn small" data-fill="${col.fill}">${FILL_LABEL[col.fill]}</button>`:''}</div>`}
    h+=fieldHtml(col,draft[col.key],reg);
    if(col.fill&&!col.sec)h+=`<div class="fld" style="justify-content:flex-end"><button type="button" class="btn small" data-fill="${col.fill}">${FILL_LABEL[col.fill]}</button></div>`;
  }
  if(reg.layout==='steelBlock')h+=`<div class="grpttl">Closing balance (calculated)</div><div class="fld wide"><div class="calcv" data-calc="_steel"></div></div>`;
  $('#dlgBody').innerHTML=h;$('#dlgDel').hidden=!row;$('#dlgDel').textContent='Delete';delete $('#dlgDel').dataset.sure;
  $('#dlgBody').oninput=$('#dlgBody').onchange=e=>{readForm();updCalc()};
  $('#dlgBody').querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{readForm();const o=FILL[b.dataset.fill](formCtx.draft);if(!o)return;Object.assign(formCtx.draft,o);
    for(const k in o){const el=$('#dlgBody').querySelector(`[name="${k}"]`);if(el)el.value=o[k]}updCalc();toast('Filled')});
  updCalc();$('#dlg').showModal();
}
function readForm(){const d=formCtx.draft;$('#dlgBody').querySelectorAll('[name]').forEach(el=>{const n=el.name;
  if(n.includes('.')){const[k,i]=n.split('.');(d[k]??=['','',''])[+i]=el.value}else d[n]=el.value})}
function updCalc(){
  const{reg,draft}=formCtx;
  const others=rowsOf(reg.id).filter(r=>r.id!==draft.id);const all=sorted(reg,[...others,draft]);
  const saved=state.data[W().id][reg.id];state.data[W().id][reg.id]=all;const comp=compute(reg);state.data[W().id][reg.id]=saved;
  const c=comp.find(x=>x.id===draft.id);if(!c)return;
  $('#dlgBody').querySelectorAll('[data-calc]').forEach(el=>{const k=el.dataset.calc;
    if(k==='_steel'){el.innerHTML=DIAS.filter(d=>c['t'+d]||c['c'+d]).map(d=>`${d}ø: ${fmt(c['c'+d],3)}`).join(' · ')||'—';return}
    const col=reg.cols.find(x=>x.key===k);el.textContent=cellVal(col,c,false).replace(/&amp;/g,'&')||'—'});
  reg.cols.filter(x=>x.type==='carry').forEach(col=>{const el=$('#dlgBody').querySelector(`[name="${col.key}"]`);if(el&&el.value==='')el.placeholder='From previous line: '+fmt(c[col.key],col.dp??2)});
  let f=$('#dlgBody').querySelector('.formflag');
  if(c._flag){if(!f){f=document.createElement('div');f.className='fld wide formflag';$('#dlgBody').appendChild(f)}f.innerHTML=`<span class="chip ${c._flag[0]}">${esc(c._flag[1])}</span>`}else f?.remove();
}
$('#dlgForm').addEventListener('submit',e=>{e.preventDefault();if(formCtx?.kind==='custom')return formCtx.save();if(formCtx?.kind==='work')return saveWork();readForm();const{reg,row,draft}=formCtx;
  const arr=rowsOf(reg.id);if(row){arr[arr.findIndex(r=>r.id===row.id)]=draft}else arr.push(draft);
  draft._u=Date.now();persist(reg.id);$('#dlg').close();render();toast('Saved')});
$('#dlgDel').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent=formCtx.kind==='work'?'Confirm? All registers will be deleted':'Confirm delete?';return}
  if(formCtx.kind==='work'){dropWork(formCtx.work.id);$('#dlg').close();return}
  if(formCtx.kind==='custom'){formCtx.del?.();return}
  const{reg,row}=formCtx;state.data[W().id][reg.id]=rowsOf(reg.id).filter(r=>r.id!==row.id);persist(reg.id);$('#dlg').close();render();toast('Deleted')};
$('#dlgCancel').onclick=$('#dlgClose').onclick=()=>$('#dlg').close();

const WORK_FIELDS=[['name','Name of Work / કામનું નામ',1],['circle','Circle / વર્તુળ'],['division','Name of Division'],['subdivision','Name of Sub Division / પેટા વિભાગ'],
 ['estAmt','Estimated Amount / મંજુર અંદાજી રકમ'],['tenderAmt','Tender Amount / ટેન્ડરની રકમ'],['tenderNo','Tender No. / ટેન્ડર નંબર'],['agreementNo','Agreement No. / એગ્રીમેન્ટ નંબર'],
 ['agency','Name of Agency / ઠેકેદારનું નામ'],['startDate','Date of Start / કામ ચાલુ કર્યા તારીખ','date'],['timeLimit','Time Limit / સમય મર્યાદા (e.g. 08 (Eight) Months)'],['budgetHead','Budget Head / ખર્ચનું સદર'],
 ['issuedTo','Register issued to (blank = current A.E./A.A.E.)']];
function openWork(isNew){
  const w=isNew?{id:uid(),name:'',subdivision:'R&B Sub Division, Dahod',sigs:[{name:'',desig:'D.E.E.'},{name:'',desig:'A.E.'},{name:'',desig:'Agency Representative'}]}:JSON.parse(JSON.stringify(W()));
  formCtx={kind:'work',work:w,isNew};
  $('#dlgTitle').textContent=isNew?'New work':'Work details (title page)';
  $('#dlgBody').innerHTML=WORK_FIELDS.map(([k,l,t])=>`<div class="fld ${t===1?'wide':''}"><label for="w_${k}">${l}</label>${t===1?`<textarea id="w_${k}" name="${k}" rows="2">${esc(w[k]||'')}</textarea>`:`<input id="w_${k}" name="${k}" type="${t==='date'?'date':'text'}" value="${esc(w[k]||'')}">`}</div>`).join('')
   +`<div class="fld"><label for="w_stipDate">Stipulated date of completion (blank = start + time limit${autoStip(w)?': '+fdS(autoStip(w)):''})</label><input id="w_stipDate" name="stipDate" type="date" value="${esc(w.stipDate||'')}"></div>`
   +`<div class="grpttl">A.E. / A.A.E. – period of charge (the MB shows the officer in charge on each date)</div>`+[0,1,2,3].map(i=>{const o=(w.aeList||[])[i]||{};return `<div class="offrow"><div class="fld"><label for="ae_n${i}">Name ${i+1}</label><input id="ae_n${i}" value="${esc(o.name||'')}"></div><div class="fld"><label for="ae_d${i}">Designation</label><select id="ae_d${i}">${['A.E.','A.A.E.','Dy.E.E.'].map(x=>`<option ${o.desig===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fld"><label for="ae_f${i}">From</label><input id="ae_f${i}" type="date" value="${esc(o.from||'')}"></div><div class="fld"><label for="ae_t${i}">To (blank = till date)</label><input id="ae_t${i}" type="date" value="${esc(o.to||'')}"></div></div>`}).join('')
   +`<div class="grpttl">Agency engineer – period</div>`+[0,1,2].map(i=>{const o=(w.agEngList||[])[i]||{};return `<div class="offrow"><div class="fld"><label for="ag_n${i}">Name ${i+1}</label><input id="ag_n${i}" value="${esc(o.name||'')}"></div><div class="fld"><label for="ag_f${i}">From</label><input id="ag_f${i}" type="date" value="${esc(o.from||'')}"></div><div class="fld"><label for="ag_t${i}">To</label><input id="ag_t${i}" type="date" value="${esc(o.to||'')}"></div></div>`}).join('')
   +`<div class="grpttl">Index of Specimen Signature</div>`+[0,1,2,3,4].map(i=>`<div class="fld"><label for="sg_n${i}">Officer/Staff ${i+1}</label><input id="sg_n${i}" name="sn${i}" value="${esc(w.sigs?.[i]?.name||'')}"></div><div class="fld"><label for="sg_d${i}">Designation</label><input id="sg_d${i}" name="sd${i}" value="${esc(w.sigs?.[i]?.desig||'')}"></div>`).join('');
  $('#dlgDel').hidden=isNew;$('#dlgDel').textContent='Delete work';delete $('#dlgDel').dataset.sure;
  $('#dlgBody').oninput=$('#dlgBody').onchange=null;

function saveWork(){const{work:w,isNew}=formCtx;
  $('#dlgBody').querySelectorAll('[name]').forEach(el=>{if(/^s[nd]\d$/.test(el.name))return;w[el.name]=el.value});
  w.sigs=[0,1,2,3,4].map(i=>({name:$(`#sg_n${i}`).value,desig:$(`#sg_d${i}`).value}));delete w.sample;
  w.aeList=[0,1,2,3].map(i=>({name:$(`#ae_n${i}`).value.trim(),desig:$(`#ae_d${i}`).value,from:$(`#ae_f${i}`).value,to:$(`#ae_t${i}`).value})).filter(o=>o.name);
  w.agEngList=[0,1,2].map(i=>({name:$(`#ag_n${i}`).value.trim(),from:$(`#ag_f${i}`).value,to:$(`#ag_t${i}`).value})).filter(o=>o.name);
  if(isNew){state.works.push(w);state.data[w.id]={};state.cur=w.id;view.reg='dash'}else state.works[state.works.findIndex(x=>x.id===w.id)]=w;
  persist();$('#dlg').close();render();toast('Work saved')}
function confirm2(btn,msg,fn){if(btn.dataset.sure){fn();return}btn.dataset.sure=1;const t=btn.textContent;btn.textContent=msg;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent=t}},5000)}
function renderWorksList(){
  const cnt=w=>{const d=state.data[w.id]||{};return Object.values(d).reduce((a,r)=>a+(r?.length||0),0)+(w.mb?.entries?.length||0)};
  $('#main').innerHTML=`<div class="sheethead"><div><h2>My works</h2><div class="sub">${state.works.length} works · edit or delete any work at any time</div></div><div class="actions"><button class="btn primary" id="wNew">+ New work</button></div></div>
  <div class="tablewrap"><table class="reg"><thead><tr><th>Work</th><th>Agency</th><th>Start</th><th>Entries</th><th></th></tr></thead><tbody>
  ${state.works.map(w=>`<tr><td><b>${esc(w.name||'(untitled)')}</b>${w.id===state.cur?' <span class="chip ok">Open</span>':''}${w.sample?' <span class="chip warn">Sample</span>':''}<div class="note">${esc(w.agreementNo||'')}</div></td>

  </tbody></table></div><p class="note">Click Delete twice to confirm. Deletion cannot be undone, so take a backup from the Dashboard first.</p>`;
  $('#wNew').onclick=()=>openWork(true);

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.cur=b.dataset.edit;view.bill=null;persist();render();openWork(false)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirm2(b,'Confirm delete?',()=>{const keep=view.reg;dropWork(b.dataset.del);go(keep)}));

function dropWork(id){state.works=state.works.filter(w=>w.id!==id);delete state.data[id];cloudDropWork(id);
  if(!state.works.length){const w={id:uid(),name:'New work (enter details)',subdivision:'R&B Sub Division, Dahod',sigs:[]};state.works.push(w);state.data[w.id]={}}
  state.cur=state.works[0].id;view.reg='dash';persist();render();toast('Work deleted')}
$('#workSel').onchange=e=>{state.cur=e.target.value;view.bill=null;persist();render()};

function coverHtml(reg,w){
  const gu=reg.gu;
  const rowsT=[['Name of Division',w.division],['Name of Sub Division',w.subdivision],['Name of Work',w.name],['Agreement No',w.agreementNo],['Name of Agency',w.agency],['Time Limit',w.timeLimit],['Tender Amount',w.tenderAmt],['Estimated Amount',w.estAmt]];
  return `<div class="pg cover"><div>${gu?'ગુજરાત રાજ્ય':'Government of Gujarat'}</div><h1>${esc(reg.title)}</h1>
   <table>${rowsT.map(([k,v])=>`<tr><td style="width:35%">${k}</td><td>${esc(v||'')}</td></tr>`).join('')}</table></div>
   <div class="pg"><p style="font-size:13px;line-height:2;margin-top:20mm">This is certified that this register is issued to Shri/Smt. <u>${esc(w.issuedTo||aeOn(w,today()).name||'                         ')}</u>, A.E./A.A.E. for the work of ${esc(w.subdivision||'')} contains page no. ______ to ______ on dated ______________.</p>
   <p style="text-align:right;margin-top:16mm;font-size:13px">Deputy Executive Engineer<br>${esc(w.subdivision||'')}</p>
   <h3 style="text-align:center;margin-top:14mm">INDEX OF SPECIMEN SIGNATURE</h3>
   <table class="p" style="width:80%;margin:auto"><tr><th>Sr. No.</th><th>Name of Officer/Staff</th><th>Designation</th><th style="width:22%">Signature</th><th>Remarks</th></tr>
   ${[0,1,2,3,4].map(i=>`<tr><td>${i+1}</td><td>${esc(w.sigs?.[i]?.name||'')}</td><td>${esc(w.sigs?.[i]?.desig||'')}</td><td style="height:11mm"></td><td></td></tr>`).join('')}</table></div>`;
}
function printReg(reg){const w=W();

/* ===================== MB MODULE (CMB Page 1–5, For Record, Abstract) ===================== */
const MBV={items:'Tender Items',mbCover:'CMB Page 1–5',mbRecord:'For Record',mbAbstract:'Abstract'};
const UW={8:0.3950617283950617,10:0.617,12:0.89,16:1.58,20:2.47,25:3.86,32:6.32};
const MBDIAS=[8,10,12,16,20,25,32];
/* Excel ROUND jaisa: .5 hamesha shunya se door (-8.505 → -8.51) */
const r2=v=>{if(!v)return 0;const a=Math.abs(v);return Math.sign(v)*Math.round(+(a*100).toPrecision(12))/100};
const fdS=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`};
const fmt2=v=>v==null||isNaN(v)?'':Number(v).toFixed(2);
function mbOf(w=W()){w.mb??={};w.mb.cover??={};w.mb.bills??=[{id:uid(),name:'1st RA Bill',absTitle:'1st & RA BILL (ABSTRACT)'}];w.mb.entries??=[];w.items??=[];return w.mb}
const curBill=w=>{const mb=mbOf(w);let b=mb.bills.find(x=>x.id===view.bill);if(!b){b=mb.bills[mb.bills.length-1];view.bill=b.id}return b};
function itemOf(w,e){const it=(w.items||[]).find(i=>String(i.no)===String(e.itemNo));return it||{no:e.itemNo,desc:e.desc||'',unit:e.unit||'',qty:null}}
const isSteelUnit=u=>/kg|m\.?\s*t/i.test(u||'');
function lineQty(l){const v=[l.n1,l.n2,l.L,l.B,l.D].map(num).filter(x=>x!=null);return v.length?r2(v.reduce((a,b)=>a*b,1)):null}
function steelLen(l){const v=[l.n1,l.n2,l.L].map(num).filter(x=>x!=null);return v.length&&l.dia?r2(v.reduce((a,b)=>a*b,1)):null}
function entryCalc(w,e){const it=itemOf(w,e);
  if(e.steel){const len={},wt={};MBDIAS.forEach(d=>len[d]=0);(e.lines||[]).forEach(l=>{const x=steelLen(l);if(x!=null)len[+l.dia]=r2((len[+l.dia]||0)+x)});
    let kg=0;MBDIAS.forEach(d=>{wt[d]=r2(len[d]*((e.uw&&e.uw[d])||UW[d]));kg+=wt[d]});kg=r2(kg);
    const mt=/m\.?\s*t/i.test(it.unit||'');return {steel:true,len,wt,kg,qty:mt?Math.round(kg)/1000:kg,unit:it.unit||'Kg.'}}
  const q=r2((e.lines||[]).reduce((a,l)=>a+(lineQty(l)||0),0));return {qty:q,unit:it.unit||''}}
function mbLayout(w=W()){const mb=mbOf(w);const bi=Object.fromEntries(mb.bills.map((b,i)=>[b.id,i]));
  const ents=[...mb.entries].filter(e=>bi[e.bill]!=null).sort((a,b)=>bi[a.bill]-bi[b.bill]||((a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0)||(a._c||0)-(b._c||0));
  let p=5;const abs={};const out=[];
  mb.bills.forEach((b,k)=>{
    ents.filter(e=>e.bill===b.id).forEach(e=>{const pg=num(e.page)!=null?+e.page:p+1;p=Math.max(p,pg);out.push({...e,_page:pg,_calc:entryCalc(w,e)})});
    const upto=out.filter(e=>bi[e.bill]<=k);const items={};
    upto.forEach(e=>{const key=String(e.itemNo);(items[key]??={it:itemOf(w,e),rows:[],upto:0,prev:0});items[key].rows.push({page:e._page,qty:e._calc.qty});items[key].upto=r2(items[key].upto+e._calc.qty);if(bi[e.bill]<k)items[key].prev=r2(items[key].prev+e._calc.qty)});
    const list=Object.values(items).sort((a,b)=>(parseFloat(a.it.no)||0)-(parseFloat(b.it.no)||0)).map(x=>({...x,now:r2(x.upto-x.prev),limit:x.it.qty!=null&&x.upto>+x.it.qty?+x.it.qty:null}));
    const lines=list.reduce((a,x)=>a+2+Math.ceil((x.it.desc||'').length/120)+x.rows.length+3+(x.limit!=null?1:0),4);
    const n=list.length?Math.max(1,Math.ceil(lines/34)):0;abs[b.id]={list,start:p+1,pages:n};p+=n});
  return {entries:out,abs,bills:mb.bills}}

/* ===================== OFFICERS (date-wise) + STIPULATED DATE ===================== */
function officerOn(list,date){list=(list||[]).filter(o=>o&&o.name);if(!list.length)return null;
  if(date){const hit=list.find(o=>(!o.from||o.from<=date)&&(!o.to||date<=o.to));if(hit)return hit}
  return list[list.length-1]}
function aeOn(w,date){return officerOn(w.aeList,date)||{name:mbOf(w).cover.aeName||w.issuedTo||'',desig:'A.E.'}}
function agEngOn(w,date){return officerOn(w.agEngList,date)||{name:mbOf(w).cover.agencyEngineer||''}}
function autoStip(w){if(!w.startDate)return'';const t=w.timeLimit||'';const m=/(\d+)\s*(?:\([^)]*\))?\s*month/i.exec(t),d=/(\d+)\s*(?:\([^)]*\))?\s*day/i.exec(t);
  if(!m&&!d)return'';const x=new Date(w.startDate+'T00:00:00');if(m)x.setMonth(x.getMonth()+ +m[1]);if(d)x.setDate(x.getDate()+ +d[1]);x.setDate(x.getDate()-1);
  return new Date(x-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function stipOf(w){return w.stipDate||autoStip(w)}

const XL=n=>{let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
const fname=s=>(s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,80);
async function xlSave(wb,name){if(typeof ExcelJS==='undefined')return toast('The Excel library could not be loaded (internet connection required).');
  const buf=await wb.xlsx.writeBuffer();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=fname(name)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Excel file created')}
const THIN={style:'thin'};const BOX={top:THIN,left:THIN,bottom:THIN,right:THIN};
function xc(ws,r,c,v,o={}){const cell=ws.getCell(r,c+1);
  if(v&&typeof v==='object'&&'f' in v)cell.value={formula:v.f,result:v.r??undefined};else cell.value=v===''||v==null?null:v;
  if(o.b)cell.font={bold:true,size:o.sz||10};else cell.font={size:o.sz||10};
  cell.alignment={vertical:'top',wrapText:o.wrap!==false,horizontal:o.h||(typeof v==='number'||(v&&v.f)?'right':'left')};
  if(o.box!==false&&o.box)cell.border=BOX;if(o.fill)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF2F8'}};if(o.nf)cell.numFmt=o.nf;return cell}
function newSheet(wb,name,land=true){const ws=wb.addWorksheet(name.replace(/[\\/?*[\]:]/g,'').slice(0,31),{pageSetup:{paperSize:9,orientation:land?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.2,footer:0.2}}});return ws}
const nfOf=dp=>dp==null?'0.00':dp===0?'0':'0.'+'0'.repeat(dp);

/* ---- one register → sheet ---- */
function regSheet(wb,reg,w){const rows=compute(reg,w);const ws=newSheet(wb,reg.short);
  const ttl=(r,t,ncol)=>{ws.mergeCells(r,1,r,ncol);xc(ws,r,0,t,{b:true,h:'center',sz:12})};
  if(reg.layout==='steelBlock')return steelBlockSheet(ws,reg,rows,w,ttl);
  if(reg.layout==='sieve')return sieveSheet(ws,reg,rows,w,ttl);
  const cols=reg.cols.filter(c=>!c.formOnly);const n=cols.length;const hasG=cols.some(c=>c.grpH);
  ttl(1,reg.title,n);ws.mergeCells(2,1,2,n);xc(ws,2,0,'Name of Work: '+(w.name||''),{});
  let r=4;
  cols.forEach((c,j)=>{if(c.grpH){xc(ws,r,j,c.grpH,{b:true,box:1,fill:1,h:'center'});xc(ws,r+1,j,c.label,{b:true,box:1,fill:1,h:'center'})}else{xc(ws,r,j,c.label,{b:true,box:1,fill:1,h:'center'});if(hasG){xc(ws,r+1,j,'',{box:1,fill:1});ws.mergeCells(r,j+1,r+1,j+1)}}});
  if(hasG){let j=0;while(j<n){const g=cols[j].grpH;if(g){let k=j;while(k+1<n&&cols[k+1].grpH===g)k++;if(k>j)ws.mergeCells(r,j+1,r,k+1);j=k+1}else j++}r+=2}else r+=1;
  cols.forEach((c,j)=>xc(ws,r,j,c.no,{box:1,h:'center',sz:8}));r++;
  const first=r;const L={};cols.forEach((c,j)=>L[c.key]=XL(j));
  // group info for day-group registers
  const gStart={},gEnd={};if(reg.layout==='dayGroup'){let s=null;rows.forEach((c,i)=>{if(c._first)s=i;gStart[i]=s;let e=i;while(e+1<rows.length&&!rows[e+1]._first)e++;gEnd[i]=e})}
  rows.forEach((c,i)=>{const rr=first+i;const R=(k,dr=0)=>L[k]+(rr+dr);
    const ctx={R,L,row:rr,i,first:first,prevRow:i?rr-1:null,gS:first+(gStart[i]??i),gE:first+(gEnd[i]??i),c};
    cols.forEach((col,j)=>{let v=c[col.key];let cell;
      if(col.type==='sign'){xc(ws,rr,j,'',{box:1});return}
      if((col.only==='first'&&!c._first)||(col.only==='last'&&!c._last)){xc(ws,rr,j,'',{box:1});return}
      if(col.type==='sr'){xc(ws,rr,j,i+1,{box:1,h:'center'});return}
      if(col.type==='date'||col.date){xc(ws,rr,j,fdate(v),{box:1});return}
      const own=num(c.__raw?.[col.key]);
      if(col.type==='carry'&&own==null&&col.xf){xc(ws,rr,j,{f:col.xf(ctx),r:typeof v==='number'?v:undefined},{box:1,nf:nfOf(col.dp)});return}
      if(col.type==='calc'&&col.xf){const f=col.xf(ctx);if(f){xc(ws,rr,j,{f,r:typeof v==='number'?v:undefined},{box:1,nf:nfOf(col.dp)});return}}
      if(Array.isArray(v))v=v.map(x=>typeof x==='number'?x.toFixed(2):x).join(' / ');
      xc(ws,rr,j,typeof v==='number'?+v.toFixed(col.dp??3):(v??''),{box:1,nf:typeof v==='number'?nfOf(col.dp):undefined})})});
  cols.forEach((c,j)=>ws.getColumn(j+1).width=c.type==='sr'?6:c.type==='sign'?10:/date/.test(c.type)||c.date?11:['num','calc','carry'].includes(c.type)?10:Math.min(34,Math.max(12,(c.label||'').length*0.6)));
  ws.pageSetup.printTitlesRow=`4:${first-1}`;return ws}
function steelBlockSheet(ws,reg,rows,w,ttl){const n=3+DIAS.length+1;ttl(1,reg.title,n);ws.mergeCells(2,1,2,n);xc(ws,2,0,'Name of Work: '+(w.name||''));
  let r=4;['ક્રમ','વિગત','તારીખ',...DIAS.map(d=>d+'ø (મે.ટન)'),'વિશેષ નોંધ'].forEach((h,j)=>xc(ws,r,j,h,{b:true,box:1,fill:1,h:'center'}));r++;
  let prevClose=null;

    const lab=[['ખુલતી સિલક'],['નવી આવકની વિગત – '+(c.supplier||'')],['કુલ જથ્થો'],[(c.ra||'____')+' રનીંગ બિલ બનાવ્યા તારીખે પત્રક-૨ મુજબ વપરાશ'],['બંધ સિલક']];
    lab.forEach((l,k)=>{xc(ws,r+k,0,k+1,{box:1,h:'center'});xc(ws,r+k,1,l[0],{box:1});xc(ws,r+k,2,k===0||k===3?fdate(c.date):'',{box:1});xc(ws,r+k,3+DIAS.length,k===0?(c.remarks||''):'',{box:1})});
    DIAS.forEach((d,j)=>{const X=XL(3+j);

      xc(ws,r2,3+j,num(c['r'+d])??0,{box:1,nf:'0.000'});

    prevClose=r5;r+=5});
  ws.getColumn(1).width=5;ws.getColumn(2).width=36;ws.getColumn(3).width=11;DIAS.forEach((d,j)=>ws.getColumn(4+j).width=8);ws.getColumn(4+DIAS.length).width=18;return ws}

const b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
async function fileToBlocks(f){const buf=await f.arrayBuffer();
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name))return [{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64(buf)}}];
  if(/^image\//.test(f.type))return [{type:'image',source:{type:'base64',media_type:f.type,data:b64(buf)}}];
  if(/\.xlsx$/i.test(f.name)){if(typeof ExcelJS==='undefined')throw new Error('The Excel library could not be loaded (internet connection required).');const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);let t='';
    wb.eachSheet(ws=>{if(ws.state==='hidden')return;t+=`\n### Sheet: ${ws.name}\n`;ws.eachRow({includeEmpty:false},row=>{const v=[];row.eachCell({includeEmpty:true},c=>{let x=c.value;if(x&&typeof x==='object')x=x.result??x.text??x.richText?.map(r=>r.text).join('')??'';v.push(String(x??'').replace(/\s+/g,' ').trim())});t+=v.join('\t').replace(/\t+$/,'')+'\n'})});
    return [{type:'text',text:'Excel file data (tab-separated):\n'+t.slice(0,180000)}]}
  if(/^text\//.test(f.type)||/\.(txt|csv)$/i.test(f.name))return [{type:'text',text:(await f.text()).slice(0,180000)}];
  throw new Error('This file type is not supported. Please upload a PDF, an image (JPG/PNG), an Excel (.xlsx) or a text file. Convert Word files to PDF first.')}
async function callAI({system,messages,max=4000}){
  if(!appCfg.workerUrl)throw new Error('The administrator has not configured the Worker URL yet.');
  const tok=await user.getIdToken();
  const r=await fetch(appCfg.workerUrl,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify({model:appCfg.model||'claude-sonnet-5-5',max_tokens:max,system,messages})});
  const j=await r.json().catch(()=>null);
  if(!j)throw new Error(`The Worker URL did not return a valid response (HTTP ${r.status}). Please check the Worker URL on the Admin page.`);
  if(!r.ok)throw new Error(j.error?.message||j.error||('Error '+r.status));
  try{uref().set({aiCalls:firebase.firestore.FieldValue.increment(1),lastAi:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){}
  return (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n')}
function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('The response could not be understood.');return JSON.parse(t.slice(a,b+1))}
function ctxSummary(w){const L=mbLayout(w);const up={};L.entries.forEach(e=>{const k=String(e.itemNo);up[k]=(up[k]||0)+e._calc.qty});
  const c2=compute(REG.cement4,w),s2=compute(REG.steel2,w);
  return JSON.stringify({work:{name:w.name,agency:w.agency,agreement:w.agreementNo,start:w.startDate,timeLimit:w.timeLimit,stipulated:stipOf(w),estimate:w.estAmt,tender:w.tenderAmt,tenderPct:w.tenderPct},
    tenderItems:(w.items||[]).map(i=>({no:i.no,desc:(i.desc||'').slice(0,140),unit:i.unit,tenderQty:i.qty,rate:i.rate,mbUptoDate:up[String(i.no)]?+up[String(i.no)].toFixed(2):0})),
    bills:mbOf(w).bills.map(b=>b.name),cementStockBags:c2.length?c2[c2.length-1].closing:null,steelStockMT:s2.length?s2[s2.length-1].closing:null,mixDesign:w.mix||{},
    registers:myRegs(w).map(r=>({name:r.short,entries:rowsOf(r.id,w).length,flagged:compute(r,w).filter(x=>x._flag?.[0]==='bad').map(x=>x._flag[1]).slice(0,5)}))})}
function applyFields(w,type,d){const c=mbOf(w).cover;const out=[];const set=(o,k,v,label)=>{if(v==null||v==='')return;out.push({o,k,v,label,old:o[k]})};
  if(type==='ts'){set(w,'name',d.nameOfWork,'Name of Work');set(c,'tsText',[d.tsLetterNo&&('GOG R&B Dept. Letter No. : '+d.tsLetterNo),d.tsDate&&('Dt.'+fdS(d.tsDate).replace(/\//g,'.'))].filter(Boolean).join(', '),'TS letter');set(c,'tsAmt',d.tsAmount,'TS amount');set(w,'estAmt',d.estimateCost,'Estimate cost')}
  if(type==='tender'){set(w,'name',d.nameOfWork,'Name of Work');set(w,'tenderAmt',d.tenderAmount,'Tender amount');set(w,'tenderPct',d.tenderPercent,'Tender %');set(w,'agency',d.agency,'Agency');set(c,'tenderLetter',[d.approvalLetterNo,d.approvalDate&&fdS(d.approvalDate)].filter(Boolean).join(' dt. '),'Tender approval letter')}
  if(type==='wo'){set(w,'name',d.nameOfWork,'Name of Work');set(w,'agency',d.agency,'Agency');set(w,'agreementNo',d.agreementNo,'Agreement No.');set(w,'startDate',d.startDate,'Start date');set(w,'timeLimit',d.timeLimit,'Time limit');set(w,'stipDate',d.stipulatedDate,'Stipulated date');
    set(w,'tenderAmt',d.tenderAmount,'Tender amount');set(w,'tenderPct',d.tenderPercent,'Tender %');set(c,'workOrder',[d.workOrderNo,d.workOrderDate&&fdS(d.workOrderDate)].filter(Boolean).join(' dt. '),'Work order')}
  return out}
const mixKey=g=>{const x=String(g).toUpperCase().replace(/\s/g,'');const n=/M-?(\d+)/.exec(x);return n?'M'+(+n[1]>=100?+n[1]/10:+n[1]):String(g)};
/* snapshot for Undo */
const SNAP_KEYS=['name','agency','agreementNo','startDate','timeLimit','stipDate','tenderAmt','tenderPct','estAmt','items','estItems','mix'];
const snapW=w=>JSON.stringify({w:Object.fromEntries(SNAP_KEYS.map(k=>[k,w[k]===undefined?null:w[k]])),cover:mbOf(w).cover});
function undoSnap(w,s){const o=JSON.parse(s);Object.entries(o.w).forEach(([k,v])=>{if(v===null)delete w[k];else w[k]=v});mbOf(w).cover=o.cover;persist()}
/* auto-apply what was detected; returns html summary */
function autoApply(w,type,d){
  if(type==='mix'){const mx=(d.mixes||[]).filter(x=>x&&x.grade);w.mix??={};
    mx.forEach(x=>{const k=mixKey(x.grade);w.mix[k]={cement:num(x.cement),flyash:num(x.flyash),sand:num(x.sand),a20:num(x.a20),a10:num(x.a10),water:num(x.water),admixture:num(x.admixture),wc:num(x.wc),ref:x.labRef||'',src:'upload'};Object.keys(w.mix[k]).forEach(z=>w.mix[k][z]==null&&delete w.mix[k][z])});
    return mx.length?`Saved to <b>Settings → Mix design</b> (per cum, kg):<div class="tablewrap" style="margin:6px 0"><table class="reg"><thead><tr><th>Grade</th><th>Cement</th><th>Fly ash</th><th>Sand</th><th>20 mm</th><th>10 mm</th><th>Water</th><th>Admixture</th><th>w/c</th></tr></thead><tbody>${mx.map(x=>`<tr><td>${esc(mixKey(x.grade))}</td>${['cement','flyash','sand','a20','a10','water','admixture','wc'].map(k=>`<td class="n">${x[k]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div><span class="note">Re-generate the registers (MB → Uploaded MB → Fill registers from all MBs) to apply the new cement content.</span>`:null}
  if(type==='boq'){const items=(d.items||[]).filter(x=>x&&x.desc);
    items.forEach(x=>{const o={id:uid(),no:String(x.no).trim(),qty:num(x.qty),unit:x.unit||'',rate:num(x.rate),desc:x.desc};const k=w.items.findIndex(y=>String(y.no)===o.no);if(k>=0){o.id=w.items[k].id;w.items[k]=o}else w.items.push(o)});
    w.items.sort((a,b)=>(parseFloat(a.no)||0)-(parseFloat(b.no)||0));
    return items.length?`<b>${items.length} items</b> saved to <b>Work → Tender Items</b>:${itemsTable(items)}`:null}
  if(type==='estimate'){const items=(d.items||[]).filter(x=>x&&x.desc);w.estItems=items;return items.length?`<b>${items.length} estimate items</b> saved:${itemsTable(items)}`:null}
  if(['ts','tender','wo'].includes(type)){const ch=applyFields(w,type,d);ch.forEach(x=>x.o[x.k]=x.v);
    return ch.length?`Saved to <b>Work details</b>:<table class="kv">${ch.map(x=>`<tr><td>${esc(x.label)}</td><td><b>${esc(x.k.match(/date/i)?fdS(x.v):x.v)}</b>${x.old&&x.old!==x.v?`<div class="note">previously: ${esc(x.k.match(/date/i)?fdS(x.old):x.old)}</div>`:''}</td></tr>`).join('')}</table>`:null}
  return null}
const itemsTable=items=>`<div class="tablewrap" style="margin:6px 0"><table class="reg"><thead><tr><th>No.</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Item</th></tr></thead><tbody>${items.slice(0,40).map(x=>`<tr><td>${esc(x.no)}</td><td class="n">${x.qty??''}</td><td>${esc(x.unit||'')}</td><td class="n">${x.rate??''}</td><td>${esc((x.desc||'').slice(0,90))}</td></tr>`).join('')}${items.length>40?`<tr><td colspan="5" class="note">…and ${items.length-40} more</td></tr>`:''}</tbody></table></div>`;
function aiReady(){return !!(FIREBASE_CONFIG&&!EMBED&&user&&canAI()&&appCfg.workerUrl)}
function renderChat(){const w=W();
  const why=!FIREBASE_CONFIG||EMBED?'The assistant is available in the online app after Google sign-in and Worker setup.':!user?'Please sign in first.':!canAI()?'The administrator has not enabled the assistant for your account yet.':!appCfg.workerUrl?'The administrator has not configured the Worker URL yet (Admin → Assistant settings).':'';
  $('#main').innerHTML=`<div class="sheethead"><div><h2>Assistant</h2><div class="sub">${esc(w.name)}</div></div></div>
  ${why?`<div class="banner"><span>${esc(why)} Measurement Book (Excel) uploads still work without it.</span></div>`:''}
  <div class="chatlog" id="chatlog">${chat.msgs.length?'':`<div class="empty">Upload any document – TS letter, tender approval, work order, BOQ, estimate, mix design report or Measurement Book (Excel). The document type is detected automatically and the details are filled in.<br>You can also ask a question, e.g. "What is the up-to-date MB quantity of item 5?" or "How much cement is in stock?"</div>`}</div>
  <form class="composer" id="chatForm">
   <div class="crow"><label class="btn" for="c_file">Attach files</label><input type="file" id="c_file" accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.txt,.csv" multiple hidden>
    <span class="note">or drag &amp; drop files here, or paste (Ctrl+V) files / screenshots</span></div>
   <div class="fchips" id="c_files"></div>
   <div class="crow"><textarea id="c_text" rows="2" placeholder="Type a question or a note…"></textarea><button class="btn primary" id="c_send" ${chat.busy?'disabled':''}>${chat.busy?'Reading…':'Send'}</button></div></form>`;
  drawChat();
  const showFiles=()=>{$('#c_files').innerHTML=chat.files.map((f,i)=>`<span class="fchip">📎 ${esc(f.name)} <button type="button" data-rmf="${i}" aria-label="Remove">×</button></span>`).join('');
    $('#c_files').querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{chat.files.splice(+b.dataset.rmf,1);showFiles()})};
  const addFiles=fs=>{fs=fs.filter(Boolean);if(!fs.length)return;chat.files.push(...fs);showFiles()};
  showFiles();
  $('#c_file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
  dropZone($('#main'),fs=>addFiles(fs));
  $('#c_text').onpaste=e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();addFiles(fs.map((f,i)=>f.name&&f.name!=='image.png'?f:new File([f],`Pasted ${f.type.startsWith('image/')?'image':'file'} ${new Date().toLocaleTimeString('en-IN',{hour12:false}).replace(/:/g,'')}${i?'-'+i:''}.${(f.type.split('/')[1]||'bin').replace('jpeg','jpg')}`,{type:f.type})))}};
  $('#c_text').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendChat()}};
  $('#chatForm').onsubmit=e=>{e.preventDefault();sendChat()}}
/* paste anywhere on the assistant page */
document.addEventListener('paste',e=>{if(view.reg!=='chat'||e.target?.id==='c_text')return;const fs=[...(e.clipboardData?.files||[])];if(!fs.length)return;e.preventDefault();chat.files.push(...fs);renderChat()});
function drawChat(){const el=$('#chatlog');if(!el||!chat.msgs.length)return;
  el.innerHTML=chat.msgs.map((m,i)=>`<div class="msg ${m.role}"><div class="bub">${m.html||esc(m.text||'').replace(/\n/g,'<br>')}</div></div>`).join('');el.scrollTop=el.scrollHeight;
  el.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>applyResult(+b.dataset.apply));
  el.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{const m=chat.msgs[+b.dataset.undo];if(!m?.snap)return;undoSnap(W(),m.snap);m.snap=null;m.html=m.html.replace(/<button[^>]*data-undo[^>]*>.*?<\/button>/,'<span class="chip warn">Undone</span>');render();toast('Changes undone')});
  el.querySelectorAll('[data-gomb]').forEach(b=>b.onclick=()=>{view.bill=b.dataset.gomb;go('mbRecord')})}
async function isMBWorkbook(f){if(!/\.xlsx$/i.test(f.name))return null;try{return await parseMBExcel(f)}catch(e){return null}}
async function sendChat(){const w=W();const fs=[...(chat.files||[])];const text=$('#c_text').value.trim();
  if(!fs.length&&!text)return toast('Attach a file or type a question.');
  chat.msgs.push({role:'user',text:(fs.length?fs.map(x=>`📎 ${x.name}`).join('\n')+(text?'\n':''):'')+text});chat.busy=true;chat.files=[];$('#c_text').value='';renderChat();
  let mbDone=0;
  for(const f of fs){
    /* 1. Measurement Book workbook? (read locally, no AI needed) */
    const r=await isMBWorkbook(f);
    if(r){try{const m=await saveMbUpload(f.name,r);mbDone++;const pl=planMB(r.blocks);const c=k=>pl.filter(p=>p.kind===k).length;const ii=m.importInfo||{};
        chat.msgs.push({role:'bot',html:`<b>${esc(f.name)}</b> – detected as <b>Measurement Book</b> (${esc(m.bill||'RA bill')}${m.pages?`, pages ${m.pages[0]}–${m.pages[1]}`:''})${m.replaced?' – replaced the earlier copy of this bill':''}.<br>Sheets: ${esc(r.sheet)}${r.absName?' + '+esc(r.absName):''} · ${r.blocks.length} items (concrete ${c('conc')}, steel ${c('steel')}, other cement work ${c('cem')}) → <b>${ii.count||0} measurements</b> added to MB → For Record (${esc(ii.bill||'')}).
          ${ii.bad&&ii.bad.length?`<br><span class="chip warn">Differs from the MB totals: ${ii.bad.map(esc).join('; ')}</span>`:' <span class="chip ok">Totals match the MB</span>'} <button class="btn small" data-gomb="${m.billId}">View / edit</button>`})}
      catch(e){chat.msgs.push({role:'bot',text:`${f.name}: ${e.message}`})}
      renderChat();continue}
    /* 2. any other document → AI detects type and extracts */
    if(!aiReady()){chat.msgs.push({role:'bot',text:`${f.name}: this document needs the assistant, which is not available yet. ${!user?'Please sign in.':'Please ask the administrator to enable it.'}`});renderChat();continue}
    try{const blocks=await fileToBlocks(f);
      const t=await callAI({system:SYS_X,max:16000,messages:[{role:'user',content:[...blocks,{type:'text',text:detectPrompt()+(text?'\nUser note: '+text:'')}]}]});
      const res=parseJSON(t);const type=DOCT[res.type]?res.type:'other';const snap=snapW(w);const html=autoApply(w,type,res.data||{});
      if(html){persist();const i=chat.msgs.length;chat.msgs.push({role:'bot',snap,html:`<b>${esc(f.name)}</b> – detected as <b>${DOCT[type]}</b>. ${html}<div style="margin-top:6px"><button class="btn small" data-undo="${i}">Undo</button></div>`});render()}
      else chat.msgs.push({role:'bot',text:`${f.name} – detected as ${DOCT[type]}. ${type==='other'?(res.data?.summary||'')+' Nothing was filled in.':'No details could be read from it.'}`})}
    catch(e){chat.msgs.push({role:'bot',text:`${f.name}: ${e.message}`})}
    renderChat()}
  if(mbDone){const L=sortMb(w.mbFiles||[]);const i=chat.msgs.length;
    chat.msgs.push({role:'bot',type:'mb',html:`Saved Measurement Books: ${L.map(m=>esc(m.bill||m.name)).join(', ')}. You can delete items or lines, or edit measurements, in <b>MB → For Record</b>; the Abstract updates automatically. Registers are generated from all MBs, including your edits.<br><button class="btn primary small" data-apply="${i}">Fill registers…</button>`})}
  /* 3. question */
  if(text&&!fs.length){
    if(!aiReady()){chat.msgs.push({role:'bot',text:'The assistant is not available yet – see the note above.'})}
    else try{const hist=chat.msgs.filter(m=>m.role==='user'||m.answer).slice(-8).map(m=>({role:m.role==='user'?'user':'assistant',content:m.role==='user'?m.text:m.answer}));
      const t=await callAI({max:1500,system:`You are the site assistant of a Deputy Executive Engineer, Roads & Buildings Sub Division, Dahod (Gujarat). Reply in clear, concise professional English. Answer only from the data below; if the data does not contain the answer, say so plainly. Work data (JSON): ${ctxSummary(w)}`,messages:hist});
      chat.msgs.push({role:'bot',answer:t,text:t})}catch(e){chat.msgs.push({role:'bot',text:'Error: '+e.message})}}
  chat.busy=false;renderChat()}
function applyResult(i){const m=chat.msgs[i];if(m.type==='mb')return openMbFillAll()}

/* ===================== BOOT ===================== */
try{const v=localStorage.getItem(LS_KEY+'_view');if(v&&(v==='dash'||v==='chat'||v==='works'||v==='mbup'||v==='aavak'||v==='settings'||REG[v]||MBV[v]))view.reg=v}catch(e){}
document.getElementById('shelf').addEventListener('click',e=>{if(e.target.closest('[data-act="pickRegs"]'))return openRegPicker();const b=e.target.closest('[data-reg]');if(b)go(b.dataset.reg)});
render();initFirebase();
if(!EMBED&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
